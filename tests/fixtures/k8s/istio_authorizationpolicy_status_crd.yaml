# Minimal AuthorizationPolicy CRD for the hosted Istio status CAS live lane.
# Declares subresources.status so Ferrum's real IstioStatusWriter and a
# competing kube-rs status writer exercise the API server's status
# subresource. x-kubernetes-preserve-unknown-fields keeps spec/status free
# of Istio's full schema. Not an Istio install.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: authorizationpolicies.security.istio.io
spec:
  group: security.istio.io
  names:
    kind: AuthorizationPolicy
    listKind: AuthorizationPolicyList
    plural: authorizationpolicies
    shortNames:
      - ap
    singular: authorizationpolicy
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
