apiVersion: v1
kind: Namespace
metadata:
  name: __NAMESPACE__
  labels:
    ferrum.io/mesh: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: src-a
  namespace: __NAMESPACE__
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: src-b
  namespace: __NAMESPACE__
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dst-a
  namespace: __NAMESPACE__
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dst-b
  namespace: __NAMESPACE__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: src-a
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: src-a
  template:
    metadata:
      labels:
        app: src-a
        ferrum.io/mesh: enabled
    spec:
      serviceAccountName: src-a
      nodeSelector:
        ferrum.io/live-node: a
      # Ambient daemonset rollouts can briefly interrupt the first DNS packet
      # even after workload and NodeWaypoint readiness converge. Keep the
      # security assertions single-shot while making libc resolution tolerate
      # that bounded dataplane transition.
      dnsConfig:
        options:
          - name: timeout
            value: "1"
          - name: attempts
            value: "10"
      containers:
        # Keep curl first so kubectl exec deploy/src-a -- curl ... stays the
        # default container used by the harness and the frozen workflow step.
        - name: curl
          image: curlimages/curl:8.10.1
          command: ["sh", "-c", "sleep 365d"]
        # Serve excluded port 15020 inside the enrolled workload so the frozen
        # node-waypoint-ebpf-live workflow's loopback curl is a real connect4
        # exclude_port_hit (not a refused dial). A bounded-rate stimulus keeps
        # producing successful connects after readiness/baseline so occasional
        # SOCK_OPS ring-buffer loss cannot erase every event in the observation
        # window. Increments still come only from real enrolled-workload
        # excluded-port connections — never from synthetic metric mutation.
        - name: exclude-port
          image: python:3.12-alpine
          ports:
            - containerPort: 15020
              name: exclude-port
          readinessProbe:
            tcpSocket:
              port: 15020
            initialDelaySeconds: 1
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 30
          command:
            - python
            - -u
            - -c
            - |
              import http.client
              import socket
              import threading
              import time

              PORT = 15020
              RESPONSE = (
                  b"HTTP/1.1 200 OK\r\n"
                  b"content-length: 14\r\n"
                  b"\r\n"
                  b"exclude-port\n"
              )
              listener_ready = threading.Event()

              def serve():
                  server = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  server.bind(("0.0.0.0", PORT))
                  server.listen(128)
                  listener_ready.set()
                  while True:
                      conn, _ = server.accept()
                      try:
                          data = conn.recv(1024)
                          if data:
                              conn.sendall(RESPONSE)
                      finally:
                          conn.close()

              threading.Thread(target=serve, daemon=True).start()
              if not listener_ready.wait(timeout=5):
                  raise SystemExit("exclude-port listener failed to become ready")

              # Bounded stimulus (~2 Hz): real GET connects to the excluded
              # loopback port. Failures are logged and retried on the next
              # interval; this is not an unbounded hot loop and does not mint
              # metrics outside connect4.
              while True:
                  try:
                      client = http.client.HTTPConnection(
                          "127.0.0.1", PORT, timeout=1
                      )
                      client.request("GET", "/")
                      response = client.getresponse()
                      body = response.read()
                      client.close()
                      if response.status != 200 or b"exclude-port" not in body:
                          raise RuntimeError(
                              f"unexpected exclude-port response "
                              f"status={response.status!r} body={body!r}"
                          )
                  except Exception as exc:
                      print(f"exclude-port stimulus failed: {exc}", flush=True)
                  time.sleep(0.5)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: src-b
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: src-b
  template:
    metadata:
      labels:
        app: src-b
        ferrum.io/mesh: enabled
    spec:
      serviceAccountName: src-b
      nodeSelector:
        ferrum.io/live-node: b
      # Match src-a so allow and deny assertions see the same resolver policy.
      dnsConfig:
        options:
          - name: timeout
            value: "1"
          - name: attempts
            value: "10"
      containers:
        - name: curl
          image: curlimages/curl:8.10.1
          command: ["sh", "-c", "sleep 365d"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dst-a
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dst-a
  template:
    metadata:
      labels:
        app: dst-a
        ferrum.io/mesh: enabled
    spec:
      serviceAccountName: dst-a
      nodeSelector:
        ferrum.io/live-node: a
      containers:
        - name: http
          image: python:3.12-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 30
          command:
            - python
            - -u
            - -c
            - |
              import socket
              import threading
              import time

              RESPONSE = b"HTTP/1.1 200 OK\r\ncontent-length: 5\r\n\r\nok-a\n"

              def serve(family, addr):
                  s = socket.socket(family, socket.SOCK_STREAM)
                  if family == socket.AF_INET6:
                      s.setsockopt(socket.IPPROTO_IPV6, socket.IPV6_V6ONLY, 1)
                  s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  s.bind(addr)
                  s.listen(128)
                  while True:
                      conn, _ = s.accept()
                      data = conn.recv(1024)
                      if data:
                          conn.sendall(RESPONSE)
                      conn.close()

              threading.Thread(target=serve, args=(socket.AF_INET, ("0.0.0.0", 8080)), daemon=True).start()
              try:
                  threading.Thread(target=serve, args=(socket.AF_INET6, ("::", 8080, 0, 0)), daemon=True).start()
              except OSError:
                  pass
              while True:
                  time.sleep(3600)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dst-b
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dst-b
  template:
    metadata:
      labels:
        app: dst-b
        ferrum.io/mesh: enabled
    spec:
      serviceAccountName: dst-b
      nodeSelector:
        ferrum.io/live-node: b
      containers:
        - name: http
          image: python:3.12-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 30
          command:
            - python
            - -u
            - -c
            - |
              import socket
              import threading
              import time

              RESPONSE = b"HTTP/1.1 200 OK\r\ncontent-length: 5\r\n\r\nok-b\n"

              def serve(family, addr):
                  s = socket.socket(family, socket.SOCK_STREAM)
                  if family == socket.AF_INET6:
                      s.setsockopt(socket.IPPROTO_IPV6, socket.IPV6_V6ONLY, 1)
                  s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  s.bind(addr)
