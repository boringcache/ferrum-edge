apiVersion: v1
kind: Namespace
metadata:
  name: __NAMESPACE__
  labels:
    ferrum.io/mesh: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: src-a
  namespace: __NAMESPACE__
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: src-b
  namespace: __NAMESPACE__
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dst-a
  namespace: __NAMESPACE__
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dst-b
  namespace: __NAMESPACE__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: src-a
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: src-a
  template:
    metadata:
      labels:
        app: src-a
        ferrum.io/mesh: enabled
    spec:
      serviceAccountName: src-a
      nodeSelector:
        ferrum.io/live-node: a
      # Ambient daemonset rollouts can briefly interrupt the first DNS packet
      # even after workload and NodeWaypoint readiness converge. Keep the
      # security assertions single-shot while making libc resolution tolerate
      # that bounded dataplane transition.
      dnsConfig:
        options:
          - name: timeout
            value: "1"
          - name: attempts
            value: "10"
      containers:
        - name: curl
          image: curlimages/curl:8.10.1
          command: ["sh", "-c", "sleep 365d"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: src-b
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: src-b
  template:
    metadata:
      labels:
        app: src-b
        ferrum.io/mesh: enabled
    spec:
      serviceAccountName: src-b
      nodeSelector:
        ferrum.io/live-node: b
      # Match src-a so allow and deny assertions see the same resolver policy.
      dnsConfig:
        options:
          - name: timeout
            value: "1"
          - name: attempts
            value: "10"
      containers:
        - name: curl
          image: curlimages/curl:8.10.1
          command: ["sh", "-c", "sleep 365d"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dst-a
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dst-a
  template:
    metadata:
      labels:
        app: dst-a
        ferrum.io/mesh: enabled
    spec:
      serviceAccountName: dst-a
      nodeSelector:
        ferrum.io/live-node: a
      containers:
        - name: http
          image: python:3.12-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 30
          command:
            - python
            - -u
            - -c
            - |
              import socket
              import threading
              import time

              RESPONSE = b"HTTP/1.1 200 OK\r\ncontent-length: 5\r\n\r\nok-a\n"

              def serve(family, addr):
                  s = socket.socket(family, socket.SOCK_STREAM)
                  if family == socket.AF_INET6:
                      s.setsockopt(socket.IPPROTO_IPV6, socket.IPV6_V6ONLY, 1)
                  s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  s.bind(addr)
                  s.listen(128)
                  while True:
                      conn, _ = s.accept()
                      data = conn.recv(1024)
                      if data:
                          conn.sendall(RESPONSE)
                      conn.close()

              threading.Thread(target=serve, args=(socket.AF_INET, ("0.0.0.0", 8080)), daemon=True).start()
              try:
                  threading.Thread(target=serve, args=(socket.AF_INET6, ("::", 8080, 0, 0)), daemon=True).start()
              except OSError:
                  pass
              while True:
                  time.sleep(3600)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dst-b
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dst-b
  template:
    metadata:
      labels:
        app: dst-b
        ferrum.io/mesh: enabled
    spec:
      serviceAccountName: dst-b
      nodeSelector:
        ferrum.io/live-node: b
      containers:
        - name: http
          image: python:3.12-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 30
          command:
            - python
            - -u
            - -c
            - |
              import socket
              import threading
              import time

              RESPONSE = b"HTTP/1.1 200 OK\r\ncontent-length: 5\r\n\r\nok-b\n"

              def serve(family, addr):
                  s = socket.socket(family, socket.SOCK_STREAM)
                  if family == socket.AF_INET6:
                      s.setsockopt(socket.IPPROTO_IPV6, socket.IPV6_V6ONLY, 1)
                  s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  s.bind(addr)
                  s.listen(128)
                  while True:
                      conn, _ = s.accept()
                      data = conn.recv(1024)
                      if data:
                          conn.sendall(RESPONSE)
                      conn.close()

              threading.Thread(target=serve, args=(socket.AF_INET, ("0.0.0.0", 8080)), daemon=True).start()
              try:
                  threading.Thread(target=serve, args=(socket.AF_INET6, ("::", 8080, 0, 0)), daemon=True).start()
              except OSError:
                  pass
              while True:
                  time.sleep(3600)
---
apiVersion: v1
kind: Service
metadata:
  name: dst-a
  namespace: __NAMESPACE__
spec:
  __SERVICE_IP_FAMILY_BLOCK__
  selector:
    app: dst-a
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: dst-b
  namespace: __NAMESPACE__
spec:
  __SERVICE_IP_FAMILY_BLOCK__
  selector:
    app: dst-b
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: __NAMESPACE__
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: deny-src-b
  namespace: __NAMESPACE__
spec:
  action: DENY
  rules:
    - from:
        - source:
            principals:
              - __TRUST_DOMAIN__/ns/__NAMESPACE__/sa/src-b
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-src-a-to-destinations
  namespace: __NAMESPACE__
spec:
  action: ALLOW
  selector:
    matchLabels:
      app: dst-a
  rules:
    - from:
        - source:
            principals:
              - __TRUST_DOMAIN__/ns/__NAMESPACE__/sa/src-a
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-src-a-cross-node
  namespace: __NAMESPACE__
spec:
  action: ALLOW
  selector:
    matchLabels:
      app: dst-b
  rules:
    - from:
        - source:
            principals:
              - __TRUST_DOMAIN__/ns/__NAMESPACE__/sa/src-a
---
# ── NodeWaypoint UDP/DTLS listener datapath (issue #3286) ────────────────────
#
# `udp-echo` is an ordinary in-mesh Service whose port declares `protocol: UDP`.
# With FERRUM_MESH_NODE_WAYPOINT_UDP_LISTENERS_ENABLED=true the NodeWaypoint
# materializes ONE datagram listener on that port number in the host network
# namespace and forwards to the Service's backing pods. A co-located enrolled
# pod that sends to <node IP>:__UDP_LISTENER_PORT__ therefore reaches the production UDP
# listener, and its source pod is attributed from the kernel-reported ingress
# interface (its veth) before `mesh_authz` evaluates scoped policy.
#
# The two UDP senders deliberately REUSE the src-a / src-b ServiceAccounts, so
# the same principal-keyed AuthorizationPolicies that govern the HTTP checks
# also govern these datagrams: `deny-src-b` is namespace-scoped and matches the
# src-b principal, so it applies to the src-b source scope and not to src-a's.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: udp-echo
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: udp-echo
  template:
    metadata:
      labels:
        app: udp-echo
        ferrum.io/mesh: enabled
    spec:
      serviceAccountName: dst-a
      nodeSelector:
        ferrum.io/live-node: a
      containers:
        - name: udp
          image: python:3.12-alpine
          ports:
            - containerPort: __UDP_LISTENER_PORT__
              protocol: UDP
          command:
            - python
            - -u
            - -c
            - |
              import socket

              s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              s.bind(("0.0.0.0", __UDP_LISTENER_PORT__))
              while True:
                  data, peer = s.recvfrom(2048)
                  # Logged so the live gate can prove a REFUSED datagram never
                  # reached the backend, not merely that no reply came back
                  # (a spoofed datagram's reply would be sent to the forged
                  # address, so reply-absence alone would be vacuous).
                  print("recv:" + data.decode("utf-8", "replace"), flush=True)
                  s.sendto(b"udp-ok:" + data, peer)
---
apiVersion: v1
kind: Service
metadata:
  name: udp-echo
  namespace: __NAMESPACE__
spec:
  selector:
    app: udp-echo
  ports:
    - name: udp
      port: __UDP_LISTENER_PORT__
      targetPort: __UDP_LISTENER_PORT__
      protocol: UDP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: udp-src-a
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: udp-src-a
  template:
    metadata:
      labels:
        app: udp-src-a
        ferrum.io/mesh: enabled
    spec:
      serviceAccountName: src-a
      nodeSelector:
        ferrum.io/live-node: a
      containers:
        - name: udp
          image: python:3.12-alpine
          command: ["sh", "-c", "sleep 365d"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: udp-src-b
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: udp-src-b
  template:
    metadata:
      labels:
        app: udp-src-b
        ferrum.io/mesh: enabled
    spec:
      serviceAccountName: src-b
