                  time.sleep(3600)
---
apiVersion: v1
kind: Service
metadata:
  name: dst-a
  namespace: __NAMESPACE__
spec:
  __SERVICE_IP_FAMILY_BLOCK__
  selector:
    app: dst-a
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: dst-b
  namespace: __NAMESPACE__
spec:
  __SERVICE_IP_FAMILY_BLOCK__
  selector:
    app: dst-b
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: __NAMESPACE__
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: deny-src-b
  namespace: __NAMESPACE__
spec:
  action: DENY
  rules:
    - from:
        - source:
            principals:
              - __TRUST_DOMAIN__/ns/__NAMESPACE__/sa/src-b
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-src-a-to-destinations
  namespace: __NAMESPACE__
spec:
  action: ALLOW
  selector:
    matchLabels:
      app: dst-a
  rules:
    - from:
        - source:
            principals:
              - __TRUST_DOMAIN__/ns/__NAMESPACE__/sa/src-a
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-src-a-cross-node
  namespace: __NAMESPACE__
spec:
  action: ALLOW
  selector:
    matchLabels:
      app: dst-b
  rules:
    - from:
        - source:
            principals:
              - __TRUST_DOMAIN__/ns/__NAMESPACE__/sa/src-a
