{{- if .Values.ambient.enabled }}
{{- $ambientImageRepository := toString .Values.image.repository -}}
{{- $ambientImageTag := toString .Values.image.tag -}}
{{- $ambientEnv := default dict .Values.ambient.env -}}
{{- $ambientSpire := default dict .Values.ambient.spire -}}
{{- $ambientSpireEnabled := eq (lower (toString (default false $ambientSpire.enabled))) "true" -}}
{{- $ambientSpireSocketHostPath := toString (default "/run/spire/sockets" $ambientSpire.socketHostPath) -}}
{{- $ambientSpireSocketMountPath := toString (default "/run/spire/sockets" $ambientSpire.socketMountPath) -}}
{{- $ambientSpireSocketFileName := toString (default "agent.sock" $ambientSpire.socketFileName) -}}
{{- $ambientSpireSocketPath := printf "%s/%s" (trimSuffix "/" $ambientSpireSocketMountPath) $ambientSpireSocketFileName -}}
{{- $ambientSpireWorkloadSpiffeId := toString (default "" $ambientSpire.workloadSpiffeId) -}}
{{- $ambientSpireProductionMode := true -}}
{{- if hasKey $ambientSpire "productionMode" -}}
{{- $ambientSpireProductionMode = $ambientSpire.productionMode -}}
{{- end -}}
{{- $ambientSpireUsesNodeName := contains "$(FERRUM_K8S_NODE_NAME)" $ambientSpireWorkloadSpiffeId -}}
{{- $ambientTopology := replace "-" "_" (lower (trim (toString (index $ambientEnv "FERRUM_MESH_TOPOLOGY")))) -}}
{{- if and (eq $ambientTopology "ambient") (not .Values.nodeAgent.enabled) -}}
{{- fail "ambient topology requires nodeAgent.enabled=true: the UDP placement guard and registry must remain durable even while UDP capture is disabled" -}}
{{- end -}}
{{- $nodeWaypointRegistryEnabled := eq $ambientTopology "node_waypoint" -}}
{{- /* NodeWaypoint UDP/DTLS Service-path steering shells out to
       iptables/ip6tables/ip (`HostNamespaceSteerBackend`). Only `true`/`1`
       enable it — matches `node_waypoint_udp_listeners_enabled_from_env`. */ -}}
{{- $nodeWaypointUdpListeners := false -}}
{{- if and $nodeWaypointRegistryEnabled (hasKey $ambientEnv "FERRUM_MESH_NODE_WAYPOINT_UDP_LISTENERS_ENABLED") -}}
{{- $nodeWaypointUdpListeners = has (lower (trim (toString (index $ambientEnv "FERRUM_MESH_NODE_WAYPOINT_UDP_LISTENERS_ENABLED")))) (list "true" "1") -}}
{{- end -}}
{{- $nodeWaypointRegistryMountPath := toString .Values.nodeAgent.podRegistryDir -}}
{{- if hasKey $ambientEnv "FERRUM_MESH_NODE_WAYPOINT_POD_REGISTRY_DIR" -}}
{{- $nodeWaypointRegistryMountPath = toString (index $ambientEnv "FERRUM_MESH_NODE_WAYPOINT_POD_REGISTRY_DIR") -}}
{{- end -}}
{{- /* Ambient per-pod-netns UDP capture producer (#2013): when the Ambient
       topology has UDP capture enabled, the proxy enters each enrolled pod's
       netns (setns) to install UDP TPROXY rules + bind transparent sockets, so
       it needs the SAME registry mount + host cgroup/proc access + setns/NET_ADMIN
       capabilities the NodeWaypoint in-netns TCP path needs (but NOT bpffs/BPF —
       the UDP producer touches no eBPF maps). */ -}}
{{- /* Only `true`/`1` enable capture — matches the Rust parser (parse_bool_env,
       which REJECTS `yes`/`on`). A looser predicate would mount privileges + set
       the node-agent registry flag while the proxy rejects its env and fails
       startup (codex). */ -}}
{{- $ambientUdpCaptureEnabled := false -}}
{{- if hasKey $ambientEnv "FERRUM_MESH_CAPTURE_UDP_ENABLED" -}}
{{- $ambientUdpCaptureEnabled = has (lower (trim (toString (index $ambientEnv "FERRUM_MESH_CAPTURE_UDP_ENABLED")))) (list "true" "1") -}}
{{- end -}}
{{- /* Host-network UDP capture placement (issue #3288). The proxy already runs
       in the host network namespace, so this placement installs its
       interface-scoped mangle rules and binds its transparent socket there —
       it needs NET_ADMIN (always granted below) but NOT SYS_ADMIN/SYS_PTRACE
       the per-pod-netns producer requires. Kubernetes hostPID is a separate
       PodSpec field (pod-scoped visibility, not a capability and not setns);
       the settled-host preflight below may still render it for the whole pod.
       Same strict `true`/`1` predicate as the capture switch. */ -}}
{{- $ambientUdpHostNetns := false -}}
{{- if hasKey $ambientEnv "FERRUM_MESH_CAPTURE_UDP_HOST_NETNS_ENABLED" -}}
{{- $ambientUdpHostNetns = has (lower (trim (toString (index $ambientEnv "FERRUM_MESH_CAPTURE_UDP_HOST_NETNS_ENABLED")))) (list "true" "1") -}}
{{- end -}}
{{- /* Mirror the Rust fail-closed gate (`udp_capture_settings_from_env`): the
       host placement is a choice of WHERE UDP capture runs, not a second feature
       switch, so enabling it alone would render privileges and a registry mount
       for a producer that never starts. */ -}}
{{- if and $ambientUdpHostNetns (not $ambientUdpCaptureEnabled) -}}
{{- fail "ambient FERRUM_MESH_CAPTURE_UDP_HOST_NETNS_ENABLED=true requires FERRUM_MESH_CAPTURE_UDP_ENABLED=true" -}}
{{- end -}}
{{- if and $ambientUdpHostNetns (ne $ambientTopology "ambient") -}}
{{- fail "ambient FERRUM_MESH_CAPTURE_UDP_HOST_NETNS_ENABLED=true requires FERRUM_MESH_TOPOLOGY=ambient" -}}
{{- end -}}
{{- $ambientUdpMigrationPhase := "stable" -}}
{{- if hasKey $ambientEnv "FERRUM_MESH_CAPTURE_UDP_MIGRATION_PHASE" -}}
{{- $ambientUdpMigrationPhase = index $ambientEnv "FERRUM_MESH_CAPTURE_UDP_MIGRATION_PHASE" | toString | trim -}}
{{- end -}}
{{- $ambientUdpMigrationFrom := default "" (index $ambientEnv "FERRUM_MESH_CAPTURE_UDP_MIGRATION_FROM") | toString | trim -}}
{{- $ambientUdpProducer := and (eq $ambientTopology "ambient") $ambientUdpCaptureEnabled -}}
{{- /* Keep registry/cleanup wiring active for every Ambient node-agent pair,
       even when captureMode=iptables. The node-agent must then hit the Rust
       fail-closed gate instead of silently omitting the eBPF pod watcher that
       disabled cleanup requires. */ -}}
{{- $ambientUdpLifecycle := and (eq $ambientTopology "ambient") .Values.nodeAgent.enabled -}}
{{- /* Ambient UDP capture requires the node-agent publisher: it publishes the
       pod uid->cgroup registry the producer consumes (mirrors the NodeWaypoint
       validations). Without it the producer polls an empty hostPath forever and
       never captures. Require nodeAgent.enabled=true + eBPF capture (codex). */ -}}
{{- if $ambientUdpProducer -}}
{{- if not .Values.nodeAgent.enabled -}}
{{- fail "ambient FERRUM_MESH_CAPTURE_UDP_ENABLED=true requires nodeAgent.enabled=true: the node-agent publishes the per-pod registry the Ambient UDP producer consumes" -}}
{{- end -}}
{{- if ne (lower (toString .Values.nodeAgent.captureMode)) "ebpf" -}}
{{- fail "ambient FERRUM_MESH_CAPTURE_UDP_ENABLED=true requires nodeAgent.captureMode=ebpf so the node-agent enrolls pods and publishes the registry" -}}
{{- end -}}
{{- end -}}
{{- /* Registry + host cgroup: needed by NodeWaypoint TCP, BOTH Ambient UDP
       placements, and the disabled stale-rule cleanup. The host placement uses
       the registry for the enrolled-pod set and the cgroup mount to resolve each
       pod's host-side interface. The tools-capable image is selected separately
       below (`-ebpf-tools` for the Ambient UDP lifecycle and NodeWaypoint UDP
       listeners, distroless `-ebpf` otherwise); do not conflate the two — they
       have different security contracts. */ -}}
{{- $ambientInNetnsCapture := or $nodeWaypointRegistryEnabled $ambientUdpLifecycle -}}
{{- /* SYS_ADMIN + SYS_PTRACE are needed ONLY by the placements that enter
       another namespace: NodeWaypoint's in-netns TCP listeners and the
       per-pod-netns UDP producer. The host-network UDP placement deliberately
       does not, which is most of its value — the running producer can capture
       UDP without those capabilities. Keeping the gate narrow means enabling
       host placement does not silently widen the DaemonSet's container
       capabilities. Note the disabled-cleanup manager still enters pod netns
       to reap predecessor rules, so the lifecycle term keeps them when UDP
       capture is off. hostPID is not part of this capability gate: it is a
       PodSpec field rendered below when setns capture OR the settled-host
       preflight needs host PID visibility. */ -}}
{{- /* Release-level attestation that the rendered placement was already
       established by a COMPLETED earlier migration release (#3703). The
       node-local durable record lives in the pod-registry hostPath, which on the
       default `/run/...` path is tmpfs: a node reboot destroys it, and a node
       that joins the cluster after the migration never had one. Without this
       attestation such a node would refuse the host placement forever and never
       publish readiness, so routine reboots and scale-out would each need their
       own cleanup/finalize rollout.
       It is derived ONLY from the INSTALLED placement ConfigMap and only when
       that installed contract already recorded this exact target in a settled
       phase, so the release performing a change can never attest itself. A
       reboot also destroys every pod netns on the node, so an attested node has
       provably no predecessor rules left to retire. The runtime consults it only
       when its durable record is ABSENT; a present, conflicting record is still
       a hard rejection. */ -}}
{{- $ambientUdpTarget := "disabled" -}}
{{- if $ambientUdpCaptureEnabled -}}
{{- $ambientUdpTarget = ternary "host-netns" "pod-netns" $ambientUdpHostNetns -}}
{{- end -}}
{{- $ambientUdpEstablished := "" -}}
{{- if and (eq $ambientTopology "ambient") (eq $ambientUdpMigrationPhase "stable") .Release.IsUpgrade -}}
{{- $ambientUdpContractName := printf "ferrum-mesh-udp-placement-%s" .Release.Name | trunc 63 | trimSuffix "-" -}}
{{- $ambientUdpInstalled := lookup "v1" "ConfigMap" .Release.Namespace $ambientUdpContractName -}}
{{- if $ambientUdpInstalled -}}
{{- $ambientUdpInstalledData := default dict $ambientUdpInstalled.data -}}
{{- if and (eq (toString (index $ambientUdpInstalledData "target")) $ambientUdpTarget) (has (toString (index $ambientUdpInstalledData "phase")) (list "stable" "finalize")) -}}
{{- $ambientUdpEstablished = $ambientUdpTarget -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- /* Node-specific proof boundary (issue #3809). The installed ConfigMap above
       is RELEASE desired state: it names no node, no node incarnation, and no
       per-node cleanup result, so it cannot distinguish a fresh/rebooted node
       from a pre-contract node that stayed booted with live workloads while it
       missed the cleanup and finalize rollout. Adopting the host placement on
       that evidence starts the host producer while those workloads' pod netns
       still redirect UDP to the retired predecessor listener.

       So the settled host placement additionally runs a PRIVILEGED one-shot
       preflight init stage that enumerates and retires BOTH predecessor
       placements (IPv4 and IPv6, host netns and every enrolled pod netns) by
       exact Ferrum-owned name, then publishes a completion attestation bound to
       this node's Kubernetes UID, its current boot id, the incoming target, and
       the release's node-proof generation. Kubernetes hostPID is pod-scoped,
       not container-scoped: enabling this init stage therefore gives the whole
       pod — init and steady-state — host PID namespace visibility.
       hostPID does not grant setns. SYS_ADMIN and SYS_PTRACE remain confined to the init
       container; the steady-state container keeps its narrow NET_ADMIN/NET_RAW
       pair after the init stage exits. Clusters that refuse hostPID or those
       init capabilities cannot use this default unchanged; set
       ambient.udpNodePreflight.enabled=false and follow the documented
       fail-closed operator recovery path. */ -}}
{{- $ambientUdpNodeProofGeneration := include "ferrum-mesh.ambientUdpNodeProofGeneration" . -}}
{{- $ambientUdpNodePreflight := default dict .Values.ambient.udpNodePreflight -}}
{{- $ambientUdpNodePreflightEnabled := true -}}
{{- if hasKey $ambientUdpNodePreflight "enabled" -}}
{{- $ambientUdpNodePreflightEnabled = eq (lower (toString $ambientUdpNodePreflight.enabled)) "true" -}}
{{- end -}}
{{- $ambientUdpRunNodePreflight := and $ambientUdpLifecycle $ambientUdpHostNetns (eq $ambientUdpMigrationPhase "stable") $ambientUdpNodePreflightEnabled -}}
{{- $hasExplicitNodeUid := hasKey $ambientEnv "FERRUM_K8S_NODE_UID" -}}
{{- if and $ambientUdpRunNodePreflight (hasKey $ambientEnv "FERRUM_K8S_NODE_NAME") -}}
{{- fail "ambient.env.FERRUM_K8S_NODE_NAME is chart-managed when the settled host-netns UDP preflight is enabled; the chart injects spec.nodeName from the downward API so the preflight's read-only nodes:get stays bound to this pod" -}}
{{- end -}}
{{- if and $ambientUdpRunNodePreflight (not $ambientUdpNodeProofGeneration) (not (hasKey $ambientEnv "FERRUM_MESH_CAPTURE_UDP_NODE_PROOF_GENERATION")) -}}
{{- fail "settled host-netns Ambient UDP placement requires an installed placement contract to derive FERRUM_MESH_CAPTURE_UDP_NODE_PROOF_GENERATION; run the explicit cleanup/finalize releases (a client-render pipeline must supply the value itself)" -}}
{{- end -}}
{{- $ambientUdpMigrationNeedsSetns := and (eq $ambientUdpMigrationPhase "cleanup") (has $ambientUdpMigrationFrom (list "pod-netns" "disabled")) -}}
{{- $ambientSetnsCapture := or $nodeWaypointRegistryEnabled (and $ambientUdpLifecycle (or (not $ambientUdpHostNetns) $ambientUdpMigrationNeedsSetns)) -}}
{{- $nodeAgentProxyMode := replace "-" "_" (lower (toString .Values.nodeAgent.proxyMode)) -}}
{{- $nodeAgentCaptureMode := lower (toString .Values.nodeAgent.captureMode) -}}
{{- $ambientAdminPort := "9000" -}}
{{- if hasKey $ambientEnv "FERRUM_ADMIN_HTTP_PORT" -}}
{{- $ambientAdminPort = toString (index $ambientEnv "FERRUM_ADMIN_HTTP_PORT") -}}
{{- end -}}
{{- $ambientAdminBindAddress := "0.0.0.0" -}}
{{- if hasKey $ambientEnv "FERRUM_ADMIN_BIND_ADDRESS" -}}
{{- $ambientAdminBindAddress = toString (index $ambientEnv "FERRUM_ADMIN_BIND_ADDRESS") -}}
{{- end -}}
{{- $ambientAdminProbeHost := include "ferrum-mesh.adminProbeHost" $ambientAdminBindAddress -}}
{{- $nodeAgentAdminPort := toString .Values.nodeAgent.admin.port -}}
{{- /* Preserve integer httpsPort=0; Sprig `default` would treat 0 as empty. */ -}}
{{- $nodeAgentAdminHttpsPort := toString .Values.nodeAgent.admin.httpsPort -}}
{{- if and .Values.nodeAgent.enabled .Values.nodeAgent.admin.enabled (ne $ambientAdminPort "0") (eq $ambientAdminPort $nodeAgentAdminPort) -}}
{{- fail (printf "ambient and nodeAgent both use hostNetwork and FERRUM_ADMIN_HTTP_PORT=%s; set ambient.env.FERRUM_ADMIN_HTTP_PORT or nodeAgent.admin.port to distinct ports, or set one listener port to 0" $ambientAdminPort) -}}
{{- end -}}
{{- /* Compare only HTTPS surfaces that will actually bind. Ambient inherits the
       binary default HTTPS port 9443, but without admin TLS material no HTTPS
       socket is opened — do not invent a collision against node-agent HTTPS. */ -}}
{{- $ambientAdminHttpsPort := "9443" -}}
{{- if hasKey $ambientEnv "FERRUM_ADMIN_HTTPS_PORT" -}}
{{- $ambientAdminHttpsPort = toString (index $ambientEnv "FERRUM_ADMIN_HTTPS_PORT") -}}
{{- end -}}
{{- $ambientAdminHttpsActive := and (ne $ambientAdminHttpsPort "0") (hasKey $ambientEnv "FERRUM_ADMIN_TLS_CERT_PATH") (hasKey $ambientEnv "FERRUM_ADMIN_TLS_KEY_PATH") -}}
{{- $nodeAgentAdminTls := .Values.nodeAgent.admin.tls | default dict -}}
{{- $nodeAgentAdminTlsConfigured := include "ferrum-mesh.nodeAgentAdminTlsConfigured" $nodeAgentAdminTls -}}
{{- $nodeAgentAdminHttpsActive := and (ne $nodeAgentAdminHttpsPort "0") $nodeAgentAdminTlsConfigured -}}
{{- if and .Values.nodeAgent.enabled .Values.nodeAgent.admin.enabled $ambientAdminHttpsActive $nodeAgentAdminHttpsActive (eq $ambientAdminHttpsPort $nodeAgentAdminHttpsPort) -}}
{{- fail (printf "ambient and nodeAgent both use hostNetwork and FERRUM_ADMIN_HTTPS_PORT=%s; set ambient.env.FERRUM_ADMIN_HTTPS_PORT or nodeAgent.admin.httpsPort to distinct ports, or set one listener port to 0" $ambientAdminHttpsPort) -}}
{{- end -}}
{{- /* Cross-protocol hostNetwork collisions: ambient HTTP vs node-agent HTTPS,
       and ambient HTTPS vs node-agent HTTP, only when both surfaces bind. */ -}}
{{- if and .Values.nodeAgent.enabled .Values.nodeAgent.admin.enabled (ne $ambientAdminPort "0") $nodeAgentAdminHttpsActive (eq $ambientAdminPort $nodeAgentAdminHttpsPort) -}}
{{- fail (printf "ambient FERRUM_ADMIN_HTTP_PORT and nodeAgent.admin.httpsPort both use hostNetwork port %s; set distinct ports or disable one listener" $ambientAdminPort) -}}
{{- end -}}
{{- if and .Values.nodeAgent.enabled .Values.nodeAgent.admin.enabled $ambientAdminHttpsActive (ne $nodeAgentAdminPort "0") (eq $ambientAdminHttpsPort $nodeAgentAdminPort) -}}
{{- fail (printf "ambient FERRUM_ADMIN_HTTPS_PORT and nodeAgent.admin.port both use hostNetwork port %s; set distinct ports or disable one listener" $ambientAdminHttpsPort) -}}
{{- end -}}
{{- if $nodeWaypointRegistryEnabled -}}
{{- if hasKey $ambientEnv "FERRUM_K8S_NODE_NAME" -}}
{{- fail "ambient.env.FERRUM_K8S_NODE_NAME is chart-managed for NodeWaypoint from downward API spec.nodeName" -}}
{{- end -}}
{{- if eq $ambientAdminPort "0" -}}
{{- fail "ambient FERRUM_MESH_TOPOLOGY=node_waypoint requires FERRUM_ADMIN_HTTP_PORT to stay enabled for the Kubernetes readiness probe" -}}
{{- end -}}
{{- if not .Values.nodeAgent.enabled -}}
{{- fail "ambient FERRUM_MESH_TOPOLOGY=node_waypoint requires nodeAgent.enabled=true" -}}
{{- end -}}
{{- if ne $nodeAgentProxyMode "node_waypoint" -}}
{{- fail "ambient FERRUM_MESH_TOPOLOGY=node_waypoint requires nodeAgent.proxyMode=node_waypoint" -}}
{{- end -}}
{{- if ne $nodeAgentCaptureMode "ebpf" -}}
{{- fail "ambient FERRUM_MESH_TOPOLOGY=node_waypoint requires nodeAgent.captureMode=ebpf" -}}
{{- end -}}
{{- end -}}
{{- if $ambientSpireEnabled -}}
{{- if eq (trim $ambientSpireWorkloadSpiffeId) "" -}}
{{- fail "ambient.spire.enabled=true requires ambient.spire.workloadSpiffeId" -}}
{{- end -}}
{{- if eq (trim $ambientSpireSocketHostPath) "" -}}
{{- fail "ambient.spire.enabled=true requires ambient.spire.socketHostPath" -}}
{{- end -}}
{{- if eq (trim $ambientSpireSocketMountPath) "" -}}
{{- fail "ambient.spire.enabled=true requires ambient.spire.socketMountPath" -}}
{{- end -}}
{{- if and $nodeWaypointRegistryEnabled (not $ambientSpireUsesNodeName) -}}
{{- fail "ambient.spire.enabled=true with NodeWaypoint requires ambient.spire.workloadSpiffeId to include $(FERRUM_K8S_NODE_NAME) for per-node SPIFFE IDs" -}}
{{- end -}}
{{- range $baseName := list "FERRUM_K8S_NODE_NAME" "FERRUM_MESH_CA_BACKEND" "FERRUM_MESH_SPIRE_AGENT_SOCKET" "FERRUM_MESH_WORKLOAD_SPIFFE_ID" "FERRUM_MESH_PRODUCTION_MODE" "FERRUM_MESH_ALLOW_NO_CA" "FERRUM_GATEWAY_SPIFFE_ID" "FERRUM_GATEWAY_SVID_CERT_PATH" "FERRUM_GATEWAY_SVID_KEY_PATH" "FERRUM_GATEWAY_SVID_TRUST_BUNDLE_PATH" "FERRUM_GATEWAY_SVID_CERT_SOURCE" "FERRUM_GATEWAY_SVID_KEY_SOURCE" "FERRUM_GATEWAY_SVID_TRUST_BUNDLE_SOURCE" -}}
{{- range $suffix := list "" "_FILE" "_VAULT" "_AWS" "_AZURE" "_GCP" -}}
{{- $name := printf "%s%s" $baseName $suffix -}}
{{- if hasKey $ambientEnv $name -}}
{{- fail (printf "ambient.env.%s is chart-managed when ambient.spire.enabled=true; set ambient.spire values instead" $name) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- /* Two DIFFERENT published runtime variants, because they are two different
       security contracts (#3705):

       * "-ebpf"       — `Dockerfile` target `runtime-ebpf`. Still DISTROLESS: it
                         adds the eBPF ELF and a staged `ip` closure but has NO
                         `/bin/sh` and NO `iptables`/`ip6tables`. Selected for
                         eBPF capture and TCP-only NodeWaypoint, which need
                         `ip` (policy rule/route) but never a shell.
       * "-ebpf-tools" — `Dockerfile` target `runtime-ebpf-tools`, a strict
                         SUPERSET of the above that also ships `/bin/sh`,
                         `iptables`, `ip6tables`, and the `*-save` helpers.

       The Ambient UDP lifecycle (#2013) AND NodeWaypoint UDP/DTLS listeners
       (issue #3286 Service-path steering) must select "-ebpf-tools", not
       "-ebpf": both execute generated `sh -c` scripts calling
       `ip`/`iptables`/`ip6tables`, which the distroless "-ebpf" image cannot
       run at all (`Command::new("sh")` is ENOENT). Selecting "-ebpf" for a
       NodeWaypoint that has UDP listeners enabled materializes the listener
       (direct node-address probes work) but never installs steering, so
       ClusterIP traffic is DNAT-ed by kube-proxy and dropped by the pod-veth
       guard. TCP-only NodeWaypoint stays distroless. The node-agent never
       receives this image. An operator tag that already names a variant is
       left alone, and an explicit "-ebpf" tag is PROMOTED (not double-suffixed)
       when tools are required. */ -}}
{{- if or $ambientUdpLifecycle $nodeWaypointUdpListeners -}}
{{- if not (hasSuffix "-ebpf-tools" $ambientImageTag) -}}
{{- $ambientImageTag = printf "%s-ebpf-tools" (trimSuffix "-ebpf" $ambientImageTag) -}}
{{- end -}}
{{- else if or (eq (lower (toString .Values.ambient.captureMode)) "ebpf") (eq $ambientTopology "node_waypoint") -}}
{{- /* "-ebpf-tools" already satisfies this tier, so never suffix it again. */ -}}
{{- if not (or (hasSuffix "-ebpf" $ambientImageTag) (hasSuffix "-ebpf-tools" $ambientImageTag)) -}}
{{- $ambientImageTag = printf "%s-ebpf" $ambientImageTag -}}
{{- end -}}
{{- end -}}
{{- $ambientImage := printf "%s:%s" $ambientImageRepository $ambientImageTag -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ferrum-mesh-ambient
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ferrum-mesh-ambient
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- if ne $ambientUdpMigrationPhase "stable" }}
  # Migration pods intentionally stay unready until cleanup/finalization proof.
  # Permit the explicit migration rollout to reach every node instead of
  # deadlocking behind the DaemonSet's default one-unavailable budget.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ferrum-mesh-ambient
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ferrum-mesh-ambient
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: ferrum-mesh
      hostNetwork: true
      {{- if or $ambientSetnsCapture $ambientUdpRunNodePreflight }}
      {{- /* PodSpec field: Kubernetes applies hostPID to every container in
             this pod. The settled-host preflight needs it to resolve
             /proc/<pid>/ns/net; the steady-state container therefore also
             sees host PIDs whenever the preflight is enabled. Visibility is
             not setns — SYS_ADMIN/SYS_PTRACE stay on the init container. */}}
      hostPID: true
      {{- end }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- if $ambientUdpRunNodePreflight }}
      initContainers:
        - name: ferrum-udp-node-preflight
          image: {{ $ambientImage | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["ambient-udp-preflight", "-v"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            {{- /* The one-shot stage runs as root with explicit capabilities, so
                   it never needs to GAIN privileges, and it must not inherit the
                   runtime's ambient/default set: dropping ALL first makes the
                   four capabilities below the complete, declared privilege
                   surface of this container. */}}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_RAW
                {{- /* setns(CLONE_NEWNET) + ptrace_may_access on
                       /proc/<pid>/ns/net, so predecessor rules can be retired
                       inside every enrolled pod netns. These are granted to the
                       INIT stage only; it exits before the steady-state
                       container starts, so the host producer still runs without
                       them. */}}
                - SYS_ADMIN
                - SYS_PTRACE
          env:
            - name: FERRUM_MESH_NODE_WAYPOINT_POD_REGISTRY_DIR
              value: {{ $nodeWaypointRegistryMountPath | quote }}
            {{- /* The preflight resolves this node's immutable Node.metadata.uid
                   ITSELF, with one bounded read-only `get` bound to this exact
                   node name, and never from the node-agent's published identity
                   file. That file records the CURRENT boot id even when a
                   PREVIOUS Kubernetes Node object wrote it, so no reader can
                   tell a stale publication from a live one — and the two
                   DaemonSets have no startup ordering between them, so the
                   replacement node-agent may not have retracted it yet. The
                   downward API cannot supply the UID, only the node name, which
                   is exactly the binding this lookup needs. */}}
            {{- if not $hasExplicitNodeUid }}
            - name: FERRUM_K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- end }}
            {{- if not (hasKey $ambientEnv "FERRUM_MESH_CAPTURE_UDP_NODE_PROOF_GENERATION") }}
            - name: FERRUM_MESH_CAPTURE_UDP_NODE_PROOF_GENERATION
              value: {{ $ambientUdpNodeProofGeneration | quote }}
            {{- end }}
            {{- range $name, $value := $ambientEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: cgroup
              mountPath: {{ .Values.nodeAgent.cgroupRoot }}
              readOnly: true
            - name: node-waypoint-pod-registry
              mountPath: {{ $nodeWaypointRegistryMountPath }}
      {{- end }}
      containers:
        - name: ferrum-edge
          image: {{ $ambientImage | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run"]
          securityContext:
            {{- if $ambientInNetnsCapture }}
            runAsUser: 0
            runAsGroup: 0
            {{- end }}
            capabilities:
              add:
                {{- if $nodeWaypointRegistryEnabled }}
                - BPF
                - PERFMON
                {{- end }}
                - NET_ADMIN
                - NET_RAW
                {{- if $ambientSetnsCapture }}
                {{- /* setns(CLONE_NEWNET) + ptrace_may_access on /proc/pid/ns/net;
                       shared by the NodeWaypoint TCP path and the per-pod-netns
                       Ambient UDP producer. The host-network UDP placement enters
                       no other namespace and so is deliberately excluded — the
                       rendered container retains its baseline NET_ADMIN/NET_RAW
                       pair. BPF/PERFMON stay NodeWaypoint-only (no eBPF here). */}}
                - SYS_ADMIN
                - SYS_PTRACE
                {{- end }}
          ports:
            - name: outbound
              containerPort: {{ .Values.ambient.outboundPort }}
            - name: inbound
              containerPort: {{ .Values.ambient.inboundPort }}
            - name: hbone
              containerPort: {{ .Values.ambient.hbonePort }}
          env:
            - name: FERRUM_MESH_CAPTURE_MODE
              value: {{ .Values.ambient.captureMode | quote }}
            {{- if and $ambientInNetnsCapture (not (hasKey $ambientEnv "FERRUM_MESH_NODE_WAYPOINT_POD_REGISTRY_DIR")) }}
            - name: FERRUM_MESH_NODE_WAYPOINT_POD_REGISTRY_DIR
              value: {{ .Values.nodeAgent.podRegistryDir | quote }}
            {{- end }}
            {{- /* Chart-managed: derived from the installed placement contract,
                   never from values. An explicit ambient.env entry still wins so
                   a GitOps/client-render pipeline can supply its own equivalent
                   cluster-state attestation.

                   This is DESIRED STATE, not authorization (issue #3809). On its
                   own it can no longer admit a recordless node: the runtime also
                   requires node-specific proof bound to this node's Kubernetes
                   UID and current boot id, which the preflight init stage above
                   publishes. A bare `FERRUM_MESH_CAPTURE_UDP_PLACEMENT_ESTABLISHED`
                   supplied by a client-render pipeline is therefore held to the
                   same boundary as the Helm-rendered one. */ -}}
            {{- if and $ambientUdpEstablished (not (hasKey $ambientEnv "FERRUM_MESH_CAPTURE_UDP_PLACEMENT_ESTABLISHED")) }}
            - name: FERRUM_MESH_CAPTURE_UDP_PLACEMENT_ESTABLISHED
              value: {{ $ambientUdpEstablished | quote }}
            {{- end }}
            {{- if and $ambientUdpNodeProofGeneration (not (hasKey $ambientEnv "FERRUM_MESH_CAPTURE_UDP_NODE_PROOF_GENERATION")) }}
            - name: FERRUM_MESH_CAPTURE_UDP_NODE_PROOF_GENERATION
              value: {{ $ambientUdpNodeProofGeneration | quote }}
            {{- end }}
            {{- /* The tc ingress redirect preserves the packet's original
                   destination instead of NAT-ing it, so the proxy answers it on
                   a dedicated TRANSPARENT INBOUND CAPTURE listener (bound on
                   FERRUM_MESH_INBOUND_LISTEN_ADDR) — deliberately NOT the HBONE
                   listener, which terminates authenticated H2 CONNECT over mesh
                   mTLS and cannot consume raw application bytes. The proxy
                   emits that listener only when it sees the SAME operator
                   variable the node-agent does (no IPC), so the chart must
                   render it into both pods — otherwise the redirect delivers
                   SYNs nothing is listening for. Mirrors the registry-dir
                   pattern: an explicit ambient.env entry wins. */ -}}
            {{- if and $nodeWaypointRegistryEnabled .Values.nodeAgent.ingressRedirectIfaces (not (hasKey $ambientEnv "FERRUM_NODE_AGENT_INGRESS_REDIRECT_IFACES")) }}
            - name: FERRUM_NODE_AGENT_INGRESS_REDIRECT_IFACES
              value: {{ .Values.nodeAgent.ingressRedirectIfaces | quote }}
            {{- end }}
            {{- if or $nodeWaypointRegistryEnabled (and $ambientSpireEnabled $ambientSpireUsesNodeName) }}
            - name: FERRUM_K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- end }}
            {{- if $ambientSpireEnabled }}
            - name: FERRUM_MESH_CA_BACKEND
              value: "spire_agent"
            - name: FERRUM_MESH_SPIRE_AGENT_SOCKET
              value: {{ $ambientSpireSocketPath | quote }}
            - name: FERRUM_MESH_WORKLOAD_SPIFFE_ID
              value: {{ $ambientSpireWorkloadSpiffeId | quote }}
            - name: FERRUM_MESH_PRODUCTION_MODE
              value: {{ $ambientSpireProductionMode | quote }}
            {{- end }}
            {{- range $name, $value := $ambientEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if or $ambientInNetnsCapture $ambientSpireEnabled .Values.ambient.extraVolumeMounts }}
          volumeMounts:
            {{- if $nodeWaypointRegistryEnabled }}
            - name: bpf-fs
              mountPath: {{ .Values.nodeAgent.bpfFsPath }}
              readOnly: true
            {{- end }}
            {{- if $ambientInNetnsCapture }}
            - name: cgroup
              mountPath: {{ .Values.nodeAgent.cgroupRoot }}
              readOnly: true
            - name: node-waypoint-pod-registry
              mountPath: {{ $nodeWaypointRegistryMountPath }}
            {{- end }}
            {{- if $ambientSpireEnabled }}
            - name: spire-agent-socket
              mountPath: {{ $ambientSpireSocketMountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.ambient.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- /* Admin-backed probes when the listener is enabled. NodeWaypoint
                 still requires a non-zero admin port (validated above). Ordinary
                 ambient also probes admin when available so rollouts wait for
                 /health. Liveness uses --live so a degraded mesh stays alive. */ -}}
          {{- $ambientHandlers := dict "live" (dict) "ready" (dict) -}}
          {{- if ne $ambientAdminPort "0" -}}
          {{- $ambientHandlers = include "ferrum-mesh.adminHealthHandlers" (dict "port" $ambientAdminPort "probeHost" $ambientAdminProbeHost) | fromYaml -}}
          {{- end -}}
          {{- $ambientLiveHandler := .Values.ambient.probes.liveness.override | default dict -}}
          {{- if not $ambientLiveHandler }}{{- $ambientLiveHandler = $ambientHandlers.live | default dict -}}{{- end -}}
          {{- $ambientReadyHandler := .Values.ambient.probes.readiness.override | default dict -}}
          {{- if not $ambientReadyHandler }}{{- $ambientReadyHandler = $ambientHandlers.ready | default dict -}}{{- end -}}
          {{- include "ferrum-mesh.renderProbes" (dict "probes" .Values.ambient.probes "liveHandler" $ambientLiveHandler "readyHandler" $ambientReadyHandler) }}
      {{- if or $ambientInNetnsCapture $ambientSpireEnabled .Values.ambient.extraVolumes }}
      volumes:
        {{- if $nodeWaypointRegistryEnabled }}
        - name: bpf-fs
          hostPath:
            path: {{ .Values.nodeAgent.bpfFsPath }}
            type: DirectoryOrCreate
        {{- end }}
        {{- if $ambientInNetnsCapture }}
        - name: cgroup
          hostPath:
            path: {{ .Values.nodeAgent.cgroupRoot }}
            type: Directory
        - name: node-waypoint-pod-registry
          hostPath:
            path: {{ .Values.nodeAgent.podRegistryDir }}
            type: DirectoryOrCreate
        {{- end }}
        {{- if $ambientSpireEnabled }}
        - name: spire-agent-socket
          hostPath:
            path: {{ $ambientSpireSocketHostPath }}
            type: DirectoryOrCreate
        {{- end }}
        {{- with .Values.ambient.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
