{{- if .Values.ca.enabled }}
{{- $caEnv := .Values.ca.env | default dict -}}
{{- $adminTarget := include "ferrum-mesh.adminProbeTargetFromEnv" $caEnv | fromYaml -}}
{{- $handlers := dict "live" (dict) "ready" (dict) -}}
{{- if ne (toString $adminTarget.port) "0" -}}
{{- $handlers = include "ferrum-mesh.adminHealthHandlers" $adminTarget | fromYaml -}}
{{- end -}}
{{- $liveHandler := .Values.ca.probes.liveness.override | default dict -}}
{{- if not $liveHandler }}{{- $liveHandler = $handlers.live | default dict -}}{{- end -}}
{{- $readyHandler := .Values.ca.probes.readiness.override | default dict -}}
{{- if not $readyHandler }}{{- $readyHandler = $handlers.ready | default dict -}}{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferrum-mesh-ca
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ferrum-mesh-ca
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ferrum-mesh-ca
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ferrum-mesh-ca
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: ferrum-mesh
      containers:
        - name: ferrum-edge
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run"]
          env:
            {{- include "ferrum-mesh.renderControlPlaneRequiredEnv" . | nindent 12 }}
            - name: FERRUM_MODE
              value: cp
            {{- range $name, $value := .Values.ca.env }}
            {{- if not (has $name (list "FERRUM_DB_TYPE" "FERRUM_DB_URL" "FERRUM_ADMIN_JWT_SECRET" "FERRUM_CP_DP_GRPC_JWT_SECRET")) }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          {{- include "ferrum-mesh.renderProbes" (dict "probes" .Values.ca.probes "liveHandler" $liveHandler "readyHandler" $readyHandler) }}
{{- end }}
