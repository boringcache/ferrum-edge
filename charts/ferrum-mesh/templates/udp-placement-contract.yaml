{{- if .Values.ambient.enabled -}}
{{- $env := default dict .Values.ambient.env -}}
{{- $topology := replace "-" "_" (lower (trim (toString (index $env "FERRUM_MESH_TOPOLOGY")))) -}}
{{- if eq $topology "ambient" -}}
{{- $enabled := false -}}
{{- if hasKey $env "FERRUM_MESH_CAPTURE_UDP_ENABLED" -}}
{{- $enabled = has (lower (trim (toString (index $env "FERRUM_MESH_CAPTURE_UDP_ENABLED")))) (list "true" "1") -}}
{{- end -}}
{{- $host := false -}}
{{- if hasKey $env "FERRUM_MESH_CAPTURE_UDP_HOST_NETNS_ENABLED" -}}
{{- $host = has (lower (trim (toString (index $env "FERRUM_MESH_CAPTURE_UDP_HOST_NETNS_ENABLED")))) (list "true" "1") -}}
{{- end -}}
{{- $target := "disabled" -}}
{{- if $enabled -}}{{- $target = ternary "host-netns" "pod-netns" $host -}}{{- end -}}
{{- $phase := "stable" -}}
{{- if hasKey $env "FERRUM_MESH_CAPTURE_UDP_MIGRATION_PHASE" -}}
{{- $phase = index $env "FERRUM_MESH_CAPTURE_UDP_MIGRATION_PHASE" | toString | trim -}}
{{- end -}}
{{- $generation := "" -}}
{{- if hasKey $env "FERRUM_MESH_CAPTURE_UDP_MIGRATION_GENERATION" -}}
{{- $generation = index $env "FERRUM_MESH_CAPTURE_UDP_MIGRATION_GENERATION" | toString -}}
{{- end -}}
{{- $from := default "" (index $env "FERRUM_MESH_CAPTURE_UDP_MIGRATION_FROM") | toString | trim -}}
{{- $to := default "" (index $env "FERRUM_MESH_CAPTURE_UDP_MIGRATION_TO") | toString | trim -}}
{{- if not (has $phase (list "stable" "cleanup" "finalize")) -}}
{{- fail "ambient FERRUM_MESH_CAPTURE_UDP_MIGRATION_PHASE must be stable, cleanup, or finalize" -}}
{{- end -}}
{{- if eq $phase "stable" -}}
{{- if or $generation $from $to -}}
{{- fail "ambient stable UDP placement must omit FERRUM_MESH_CAPTURE_UDP_MIGRATION_GENERATION/FROM/TO" -}}
{{- end -}}
{{- else -}}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" $generation) -}}
{{- fail "ambient UDP migration generation must be 1..=64 ASCII alphanumeric/./_/- characters and start alphanumeric" -}}
{{- end -}}
{{- if not (has $from (list "pod-netns" "host-netns" "disabled")) -}}
{{- fail "ambient UDP migration FROM must be pod-netns, host-netns, or disabled" -}}
{{- end -}}
{{- if not (has $to (list "pod-netns" "host-netns" "disabled")) -}}
{{- fail "ambient UDP migration TO must be pod-netns, host-netns, or disabled" -}}
{{- end -}}
{{- if eq $from $to -}}{{- fail "ambient UDP migration FROM and TO must differ" -}}{{- end -}}
{{- if ne $to $target -}}{{- fail "ambient UDP migration TO must match the rendered capture-enabled/host-netns target" -}}{{- end -}}
{{- end -}}
{{- $contractName := printf "ferrum-mesh-udp-placement-%s" .Release.Name | trunc 63 | trimSuffix "-" -}}
{{- $previous := dict -}}
{{- if .Release.IsUpgrade -}}
{{- $existing := lookup "v1" "ConfigMap" .Release.Namespace $contractName -}}
{{- if $existing -}}{{- $previous = default dict $existing.data -}}{{- end -}}
{{- end -}}
{{- /* Node-proof era (issue #3809).

       The node-scoped cleanup attestation must be bound to a generation that
       cannot RECUR, or a proof written for one placement era authorizes a later
       one. A token derived from the release's observable shape — `<target>-<phase>`
       — repeats the moment a target and phase recur: an old settled host era
       writes `host-netns-stable`, the cluster migrates host -> pod and back, and
       that same token names the NEW host era, so a same-boot node that missed the
       later cleanup/finalize rollout could replay its stale proof into it.

       The era is therefore a monotonic ordinal this contract INCREMENTS when a
       migration starts and then carries forward, unchanged, through finalize and
       every settled release after it. `nodeProofGeneration` is the era-qualified
       token both DaemonSets and the runtime bind proofs to; the operator's own
       migration generation rides along so a proof stays traceable to the
       transition that produced it. An installed contract predating this field
       carries no node-proof generation at all, which is fail-closed: the settled
       host DaemonSet refuses to render until an explicit cleanup/finalize pair
       has stamped one.

       A PRESENT era/generation pair is one authority boundary. Treating a
       malformed or out-of-range `nodeProofEra` as zero, or carrying a
       `nodeProofGeneration` that does not name that era, would let the next
       cleanup emit `e1.*` again and recreate a token an earlier placement era
       already used. Both fields are therefore validated as one pair: they must
       both be absent (the pre-contract cleanup entry that stamps era 1) or both
       be well-formed, in bounds, and consistent. There is no compatibility
       fallback for a partial or malformed pair. */ -}}
{{- $previousEra := 0 -}}
{{- $previousNodeProofGeneration := "" -}}
{{- $hasPreviousEra := false -}}
{{- $hasPreviousGeneration := false -}}
{{- $rawEra := "" -}}
{{- if $previous -}}
{{- if hasKey $previous "nodeProofEra" -}}
{{- $hasPreviousEra = true -}}
{{- $rawEra = trim (toString (index $previous "nodeProofEra")) -}}
{{- end -}}
{{- if hasKey $previous "nodeProofGeneration" -}}
{{- $hasPreviousGeneration = true -}}
{{- $previousNodeProofGeneration = trim (toString (index $previous "nodeProofGeneration")) -}}
{{- end -}}
{{- end -}}
{{- if or $hasPreviousEra $hasPreviousGeneration -}}
{{- if or (not $hasPreviousEra) (not $hasPreviousGeneration) -}}
{{- fail "installed Ambient UDP nodeProofEra/nodeProofGeneration pair is incomplete; both must be present and consistent, or both must be absent so cleanup can stamp era 1" -}}
{{- end -}}
{{- if not (regexMatch "^[1-9][0-9]{0,9}$" $rawEra) -}}
{{- fail "installed Ambient UDP nodeProofEra is malformed or out of supported bounds; it must be a 1..=10 digit ordinal with no leading zero" -}}
{{- end -}}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" $previousNodeProofGeneration) -}}
{{- fail "installed Ambient UDP nodeProofGeneration is malformed or out of supported bounds; it must be an era-qualified e<era>.<generation> token of 1..=64 ASCII alphanumeric/./_/- characters" -}}
{{- end -}}
{{- $generationPrefix := printf "e%s." $rawEra -}}
{{- if or (not (hasPrefix $generationPrefix $previousNodeProofGeneration)) (eq $previousNodeProofGeneration $generationPrefix) -}}
{{- fail "installed Ambient UDP nodeProofGeneration is not the era-qualified e<era>.<generation> token bound to the installed nodeProofEra" -}}
{{- end -}}
{{- $previousEra = atoi $rawEra -}}
{{- end -}}
{{- $nodeProofEra := $previousEra -}}
{{- $nodeProofGeneration := $previousNodeProofGeneration -}}
{{- if eq $phase "stable" -}}
{{- if and (not .Release.IsUpgrade) (eq $target "host-netns") -}}
{{- fail "initial host-netns Ambient UDP placement requires an explicit cleanup phase so runtime can establish durable predecessor proof" -}}
{{- end -}}
{{- if .Release.IsUpgrade -}}
{{- if $previous -}}
{{- if ne (toString (index $previous "target")) $target -}}
{{- fail "unsafe one-step Ambient UDP placement change rejected before DaemonSet rollout; render phase=cleanup with an explicit generation first" -}}
{{- end -}}
{{- if eq (toString (index $previous "phase")) "cleanup" -}}
{{- fail "Ambient UDP cleanup phase cannot be skipped; render phase=finalize with the same generation before returning to stable" -}}
{{- end -}}
{{- else -}}
{{- fail "pre-contract Ambient UDP upgrade requires an explicit cleanup phase before DaemonSet rollout, regardless of requested placement" -}}
{{- end -}}
{{- end -}}
{{- else if eq $phase "cleanup" -}}
{{- $resumeCleanup := false -}}
{{- if and .Release.IsUpgrade $previous -}}
{{- $previousPhase := toString (index $previous "phase") -}}
{{- $resume := and (eq $previousPhase "cleanup") (eq (toString (index $previous "generation")) $generation) (eq (toString (index $previous "from")) $from) (eq (toString (index $previous "to")) $to) -}}
{{- $start := and (has $previousPhase (list "stable" "finalize")) (eq (toString (index $previous "target")) $from) -}}
{{- if not (or $resume $start) -}}
{{- fail "Ambient UDP cleanup predecessor/generation does not match the installed placement contract" -}}
{{- end -}}
{{- $resumeCleanup = $resume -}}
{{- end -}}
{{- /* Starting a migration opens a NEW placement era; re-rendering the same
       cleanup release resumes the one already open, so the ordinal is stable
       across retries but strictly increasing across transitions. */ -}}
{{- if not (and $resumeCleanup $nodeProofGeneration) -}}
{{- $nextEra := add1 $previousEra -}}
{{- $nextEraStr := $nextEra | toString -}}
{{- if not (regexMatch "^[1-9][0-9]{0,9}$" $nextEraStr) -}}
{{- fail "Ambient UDP nodeProofEra cannot increment without overflowing the supported 1..=10 digit ordinal" -}}
{{- end -}}
{{- $nodeProofEra = $nextEra -}}
{{- $nodeProofGeneration = printf "e%d.%s" $nodeProofEra $generation | trunc 64 -}}
{{- end -}}
{{- else -}}
{{- if not .Release.IsUpgrade -}}
{{- fail "Ambient UDP finalize is valid only after an installed cleanup release" -}}
{{- end -}}
{{- if not $previous -}}
{{- fail "Ambient UDP finalize requires the installed cleanup placement contract" -}}
{{- end -}}
{{- if or (ne (toString (index $previous "phase")) "cleanup") (ne (toString (index $previous "generation")) $generation) (ne (toString (index $previous "from")) $from) (ne (toString (index $previous "to")) $to) -}}
{{- fail "Ambient UDP finalize generation/from/to must exactly match the installed cleanup phase" -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $contractName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ferrum-mesh-udp-placement
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  target: {{ $target | quote }}
  phase: {{ $phase | quote }}
  generation: {{ $generation | quote }}
  from: {{ $from | quote }}
  to: {{ $to | quote }}
  # Migration-era provenance for the node-scoped placement proof (issue #3809).
  # Both keys stay absent until cleanup stamps a non-empty era-qualified token;
  # once stamped they are carried unchanged through cleanup retry, finalize, and
  # every settled release after it.
  #
  # The generation gate must NOT right-chomp (`-}}`). A right-chomp after YAML
  # comments concatenates `nodeProofEra` onto the preceding comment, so an
  # unstamped contract is fine but a stamped one would emit only
  # `nodeProofGeneration` as a real data key.
{{- if $nodeProofGeneration }}
  nodeProofEra: {{ $nodeProofEra | toString | quote }}
  nodeProofGeneration: {{ $nodeProofGeneration | quote }}
{{- end }}
{{- end -}}
{{- end -}}
