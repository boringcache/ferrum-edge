{{- /* Read-only node lookup for the privileged Ambient UDP node preflight
       (issue #3809).

       The preflight init stage must resolve THIS node's immutable
       `Node.metadata.uid` itself: the downward API exposes `spec.nodeName` but
       not the UID, and the node-agent's published identity file records the
       current boot id even when a PREVIOUS Kubernetes Node object wrote it, so
       consuming it could pair a stale identity with the stale cleanup proof
       written under it and authorize node-name reuse under the wrong immutable
       UID.

       The grant is read-only `nodes: get` with no list, watch, or write. That
       cannot enumerate or mutate nodes, but Kubernetes RBAC does not treat a
       `get` without `resourceNames` as a single-object restriction: a named GET
       is permitted for any node whose name the caller already knows. The
       runtime request is what binds the lookup to this pod's `spec.nodeName`
       (or an explicit `FERRUM_K8S_NODE_UID`). Do not describe this Role as a
       per-node enforcement boundary Kubernetes does not provide, and do not
       widen it with list/watch/write or a cluster-wide name grant. It is
       rendered only for Ambient releases, which are the only ones that run the
       preflight. */ -}}
{{- $ambientEnv := default dict .Values.ambient.env -}}
{{- $ambientTopology := replace "-" "_" (lower (trim (toString (index $ambientEnv "FERRUM_MESH_TOPOLOGY")))) -}}
{{- if and .Values.ambient.enabled (eq $ambientTopology "ambient") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ferrum-mesh-ambient-{{ .Release.Name }}
  labels:
    app.kubernetes.io/name: ferrum-mesh-ambient
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ferrum-mesh-ambient-{{ .Release.Name }}
  labels:
    app.kubernetes.io/name: ferrum-mesh-ambient
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ferrum-mesh-ambient-{{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: ferrum-mesh
    namespace: {{ .Release.Namespace }}
{{- end }}
