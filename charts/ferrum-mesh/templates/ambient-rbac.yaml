{{- /* Read-only node lookup for the privileged Ambient UDP node preflight
       (issue #3809).

       The preflight init stage must resolve THIS node's immutable
       `Node.metadata.uid` itself: the downward API exposes `spec.nodeName` but
       not the UID, and the node-agent's published identity file records the
       current boot id even when a PREVIOUS Kubernetes Node object wrote it, so
       consuming it could pair a stale identity with the stale cleanup proof
       written under it and authorize node-name reuse under the wrong immutable
       UID.

       The grant is therefore the narrowest one that supports a named `get` on a
       single object: no create/update/patch/delete, and deliberately no
       list/watch, so this service account can never enumerate the cluster's
       nodes. It is rendered only for Ambient releases, which are the only ones
       that run the preflight. */ -}}
{{- $ambientEnv := default dict .Values.ambient.env -}}
{{- $ambientTopology := replace "-" "_" (lower (trim (toString (index $ambientEnv "FERRUM_MESH_TOPOLOGY")))) -}}
{{- if and .Values.ambient.enabled (eq $ambientTopology "ambient") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ferrum-mesh-ambient-{{ .Release.Name }}
  labels:
    app.kubernetes.io/name: ferrum-mesh-ambient
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ferrum-mesh-ambient-{{ .Release.Name }}
  labels:
    app.kubernetes.io/name: ferrum-mesh-ambient
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ferrum-mesh-ambient-{{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: ferrum-mesh
    namespace: {{ .Release.Namespace }}
{{- end }}
