# Production-style control-plane install using existing Kubernetes Secrets.
# This file deliberately contains no credential values. The database URL Secret
# can point at PostgreSQL, MySQL, MongoDB, or SQLite; set database.type to match.

controlPlane:
  enabled: true
  database:
    type: postgres
    existingSecret:
      name: ferrum-mesh-production-db
      urlKey: url
  credentials:
    adminJwtSecret:
      existingSecret:
        name: ferrum-mesh-production-credentials
        key: admin-jwt-secret
    cpDpGrpcJwtSecret:
      existingSecret:
        name: ferrum-mesh-production-credentials
        key: cp-dp-grpc-jwt-secret
  env:
    FERRUM_MODE: cp
    FERRUM_XDS_ENABLED: "true"
    FERRUM_LOG_LEVEL: info
    FERRUM_CP_NAMESPACES: "*"
    # Required for multi-namespace / "*" scope (advisory GHSA-3f2j-wwqw-grmg).
    # Mount a JSON trust-bundle Secret/ConfigMap to this path; see
    # docs/cp_namespace_tenancy.md. The fleet-wide cpDpGrpcJwtSecret alone is
    # not an authorization boundary across tenants.
    FERRUM_CP_DP_GRPC_TRUST_BUNDLE_PATH: /etc/ferrum/cp-dp-trust-bundle.json
    # Production installs must configure CP/DP gRPC TLS before enabling the
    # control plane listener on non-loopback addresses. Mount TLS material and
    # set FERRUM_CP_GRPC_TLS_CERT_PATH / FERRUM_CP_GRPC_TLS_KEY_PATH.

injector:
  enabled: false

ca:
  enabled: false
