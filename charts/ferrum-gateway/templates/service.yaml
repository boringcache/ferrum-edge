{{- if and .Values.service.enabled (ne .Values.mode "cp") }}
{{- $ports := .Values.ports | default dict -}}
{{- $frontendTls := (.Values.tls | default dict).frontend | default dict -}}
{{/* file/database only start the HTTPS proxy listener when frontend TLS material
     is configured, so the Service HTTPS port is gated on that. A dp binds the
     HTTPS listener whenever the port is nonzero (empty dynamic slot hot-swapped
     with CP-delivered Gateway TLS, src/modes/data_plane.rs), so its Service
     HTTPS port tracks the port alone. */}}
{{- $httpsListenerActive := or (and $frontendTls.enabled $frontendTls.secretName) (eq .Values.mode "dp") -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ferrum-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ferrum-gateway.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ferrum-gateway.selectorLabels" . | nindent 4 }}
  ports:
    {{- if and (hasKey $ports "proxyHttp") (ne ($ports.proxyHttp | toString) "0") }}
    - name: http
      port: {{ .Values.service.httpPort | default 80 }}
      targetPort: proxy-http
      protocol: TCP
    {{- end }}
    {{- if and (hasKey $ports "proxyHttps") (ne ($ports.proxyHttps | toString) "0") $httpsListenerActive }}
    - name: https
      port: {{ .Values.service.httpsPort | default 443 }}
      targetPort: proxy-https
      protocol: TCP
    {{- end }}
    {{- range .Values.streamPorts }}
    {{- if .service }}
    - name: {{ .name }}
      port: {{ .servicePort | default .containerPort }}
      targetPort: {{ .name }}
      protocol: {{ .protocol | default "TCP" }}
    {{- end }}
    {{- end }}
{{- end }}
