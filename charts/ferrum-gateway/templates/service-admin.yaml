{{- if .Values.admin.service.enabled }}
{{- $ports := .Values.ports | default dict -}}
{{- $adminTls := (.Values.tls | default dict).admin | default dict -}}
{{/* Fail render rather than ship a portless admin Service (rejected by the API
     server) when the operator explicitly asked for one but no admin port is
     publishable: adminHttp disabled AND no usable admin HTTPS port (adminHttps=0
     or admin TLS unset). This can slip past the probe/TLS guards when the
     computed probes are overridden/disabled. Mirror the proxy Service's
     port-availability requirement with actionable guidance. */}}
{{- $hasAdminHttp := and (hasKey $ports "adminHttp") (ne ($ports.adminHttp | toString) "0") -}}
{{- $hasAdminHttps := and (hasKey $ports "adminHttps") (ne ($ports.adminHttps | toString) "0") $adminTls.enabled $adminTls.secretName -}}
{{- if not (or $hasAdminHttp $hasAdminHttps) -}}
{{- fail "admin.service.enabled=true but no admin Service port is publishable: enable a plaintext admin listener (ports.adminHttp>0) or admin HTTPS (ports.adminHttps>0 with tls.admin.enabled + tls.admin.secretName). A Service with no ports is rejected by the API server; set admin.service.enabled=false if you do not need it." -}}
{{- end -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ferrum-gateway.adminServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ferrum-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-admin
  {{- with .Values.admin.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.admin.service.type | default "ClusterIP" }}
  selector:
    {{- include "ferrum-gateway.selectorLabels" . | nindent 4 }}
  ports:
    {{- if and (hasKey $ports "adminHttp") (ne ($ports.adminHttp | toString) "0") }}
    - name: admin-http
      port: {{ $ports.adminHttp }}
      targetPort: admin-http
      protocol: TCP
    {{- end }}
    {{- if and (hasKey $ports "adminHttps") (ne ($ports.adminHttps | toString) "0") $adminTls.enabled $adminTls.secretName }}
    - name: admin-https
      port: {{ $ports.adminHttps }}
      targetPort: admin-https
      protocol: TCP
    {{- end }}
{{- end }}
