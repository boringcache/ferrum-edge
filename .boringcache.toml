workspace = "boringcache/benchmarks"

[proxy]
metadata-hints = ["project=ferrum-edge"]

[entries.cargo-target]
kind = "cargo-target"
tag = "ferrum-edge-unit-tests-20260905-r2-target"
path = "target"

[entries.cargo-registry]
tag = "ferrum-edge-unit-tests-20260905-r2-registry"

[entries.cargo-git]
tag = "ferrum-edge-unit-tests-20260905-r2-git"

[profiles.cargo]
entries = ["cargo-target", "cargo-registry", "cargo-git"]

[adapters.sccache]
tag = "ferrum-edge-unit-tests-20260905-r2-compiler"

[adapters.cargo]
tag = "ferrum-edge-unit-tests-20260905-r2"
profiles = ["cargo"]
compiler-cache = "sccache"
command = ["cargo", "test", "--lib", "--test", "unit_tests", "--no-run"]
fail-on-cache-error = true
metadata-hints = ["tool=sccache", "lane=default-unit-tests"]
