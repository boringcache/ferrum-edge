version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"

  # Docker discovers every file whose name matches /dockerfile|containerfile/i,
  # so `Dockerfile`, `Dockerfile.release`, `Dockerfile.test`, and
  # `Dockerfile.ebpf-tools-layer` are all in scope. Its parser only reads `FROM`
  # lines; the `ARG <NAME>=<image>@sha256:...` defaults are refreshed by
  # `.github/workflows/base-image-digest-refresh.yml` instead. Both mechanisms
  # are digest-preserving: they rewrite the digest, never drop it.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
