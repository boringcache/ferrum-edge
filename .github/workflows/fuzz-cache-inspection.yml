name: Fuzz Cache Inspection

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: Optional CLI version for canary validation
        required: false
        type: string
        default: ""
      cli_artifact_id:
        description: Optional immutable Linux CLI artifact to validate
        required: false
        type: string
        default: ""
      cli_artifact_workspace:
        description: Workspace that owns the optional CLI artifact
        required: false
        type: string
        default: ""
      baseline_cli_artifact_id:
        description: Optional baseline CLI artifact for a same-runner comparison
        required: false
        type: string
        default: ""
      candidate_first:
        description: Restore the candidate before the optional baseline
        required: false
        type: boolean
        default: false
      transfer_http2:
        description: Enable HTTP/2 negotiation for the storage comparison
        required: false
        type: boolean
        default: true
      compare_http1:
        description: Also restore with HTTP/1.1 on the same runner
        required: false
        type: boolean
        default: false
      compare_probe_off:
        description: Also restore each variant with the slow-read probe disabled on the same runner
        required: false
        type: boolean
        default: false
      download_width:
        description: Optional comma-separated caps on concurrent blob downloads, each restored as its own pass
        required: false
        type: string
        default: ""
      entry:
        description: Cache entry tag to restore into fuzz/target
        required: false
        type: string
        default: fuzz-target-toolchain-e3b99108dfccdd33-graph-551e4f3879e93b22-branch-boringcache-validation-ubuntu-24-x86_64

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    name: Inspect restored fuzz target
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: 558a3ccd412c285c20c609be3460fdbf6947040d
          persist-credentials: false

      - name: Download the exact CLI artifact
        if: inputs.cli_artifact_id != ''
        uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_CLI_ARTIFACT_RESTORE_TOKEN }}
        with:
          cli-version: v1.30.1
          mode: artifact
          artifact-command: pull
          artifact-id: ${{ inputs.cli_artifact_id }}
          artifact-workspace: ${{ inputs.cli_artifact_workspace }}
          artifact-path: ${{ runner.temp }}/validation-cli
          trust-policy: restore

      - name: Download the baseline CLI artifact
        if: inputs.baseline_cli_artifact_id != ''
        uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_CLI_ARTIFACT_RESTORE_TOKEN }}
        with:
          cli-version: v1.30.1
          mode: artifact
          artifact-command: pull
          artifact-id: ${{ inputs.baseline_cli_artifact_id }}
          artifact-workspace: ${{ inputs.cli_artifact_workspace }}
          artifact-path: ${{ runner.temp }}/baseline-cli
          trust-policy: restore

      - name: Verify and select the CLI artifact
        if: inputs.cli_artifact_id != ''
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/validation-cli"
          sha256sum --check boringcache.sha256
          chmod +x boringcache
          echo "${RUNNER_TEMP}/validation-cli" >> "$GITHUB_PATH"
          ./boringcache --version
          if [[ -d "${RUNNER_TEMP}/baseline-cli" ]]; then
            cd "${RUNNER_TEMP}/baseline-cli"
            sha256sum --check boringcache.sha256
            chmod +x boringcache
            ./boringcache --version
          fi

      - name: Set up BoringCache
        uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_artifact_id != '' && 'skip' || inputs.cli_version }}
          mode: archive
          cache-profiles: dependencies
          trust-policy: restore
          fail-on-cache-error: true

      - name: Measure runner disk write floor
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq fio >/dev/null
          df -h / /mnt 2>/dev/null || df -h /
          for mode in "1 8" "4 8"; do
            set -- $mode
            fio --name=seqwrite --directory=. --rw=write --bs=1M --size=2G --numjobs=$1 --iodepth=$2 \
              --direct=1 --ioengine=libaio --group_reporting --output-format=json --unlink=1 \
              | python3 -c 'import json,sys; j=json.load(sys.stdin)["jobs"][0]["write"]; print(f"direct seqwrite jobs='$1' qd='$2': {j["bw_bytes"]/1e6:.0f} MB/s")'
          done
          fio --name=bufwrite --directory=. --rw=write --bs=1M --size=8G --numjobs=1 --direct=0 --end_fsync=1 \
            --ioengine=sync --output-format=json --unlink=1 \
            | python3 -c 'import json,sys; j=json.load(sys.stdin)["jobs"][0]["write"]; print(f"buffered seqwrite 8G + fsync: {j["bw_bytes"]/1e6:.0f} MB/s")'

      - name: Restore the published fuzz target
        env:
          RUST_LOG: error,boring_cache_cli::storage_transfer=info
          BORINGCACHE_TRANSFER_HTTP2: ${{ inputs.transfer_http2 }}
          COMPARE_HTTP1: ${{ inputs.compare_http1 }}
          BASELINE_ARTIFACT_ID: ${{ inputs.baseline_cli_artifact_id }}
          CANDIDATE_FIRST: ${{ inputs.candidate_first }}
          CACHE_ENTRY: ${{ inputs.entry }}
          DOWNLOAD_WIDTH: ${{ inputs.download_width }}
          COMPARE_PROBE_OFF: ${{ inputs.compare_probe_off }}
        run: |
          set -euo pipefail
          boringcache --version
          protocols=("${BORINGCACHE_TRANSFER_HTTP2}")
          if [[ "$COMPARE_HTTP1" == "true" && "$BORINGCACHE_TRANSFER_HTTP2" == "true" ]]; then
            protocols+=("false")
          fi
          variants=(candidate)
          if [[ -n "$BASELINE_ARTIFACT_ID" ]]; then
            variants=(baseline candidate)
            if [[ "$CANDIDATE_FIRST" == "true" ]]; then
              variants=(candidate baseline)
            fi
          fi
          widths=("")
          if [[ -n "$DOWNLOAD_WIDTH" ]]; then
            IFS=',' read -r -a widths <<< "$DOWNLOAD_WIDTH"
          fi
          probes=(1)
          if [[ "$COMPARE_PROBE_OFF" == "true" ]]; then
            probes=(1 0)
          fi
          pass=0
          for variant in "${variants[@]}"; do
            cli="$(command -v boringcache)"
            if [[ "$variant" == "baseline" ]]; then
              cli="${RUNNER_TEMP}/baseline-cli/boringcache"
            fi
            for protocol in "${protocols[@]}"; do
            for width in "${widths[@]}"; do
            for probe in "${probes[@]}"; do
              # Every pass, including the first, starts from the same disk
              # state: no target tree, writeback drained, page cache dropped,
              # and I/O pressure below the same threshold. A pass whose
              # cooldown budget expires is marked so the comparison can be
              # classified rather than read as equal footing.
              rm -rf -- fuzz/target
              sync
              echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null
              equalised=false
              for _ in $(seq 1 180); do
                some="$(awk '/^some/ {sub("avg10=","",$2); print $2}' /proc/pressure/io)"
                if awk -v s="$some" 'BEGIN { exit !(s < 2.0) }'; then
                  equalised=true
                  break
                fi
                sleep 1
              done
              echo "io pressure before pass ${pass} (${variant}, http2=${protocol}, width=${width:-adaptive}, probe=${probe}): $(head -1 /proc/pressure/io); memory: $(head -1 /proc/pressure/memory); equalised=${equalised}"
              if [[ "$equalised" != "true" ]]; then
                echo "::warning::pass ${pass} (${variant}, width=${width:-adaptive}, probe=${probe}) started above the I/O pressure threshold; this pass is not equalised"
              fi
              export BORINGCACHE_STORAGE_SLOW_READ_PROBE="$probe"
              unset BORINGCACHE_RESTORE_MAX_CONCURRENCY
              if [[ -n "$width" ]]; then
                export BORINGCACHE_RESTORE_MAX_CONCURRENCY="$width"
              fi
              export BORINGCACHE_TRANSFER_HTTP2="$protocol"
              export BORINGCACHE_OBSERVABILITY_JSONL_PATH="${RUNNER_TEMP}/restore-observability-${variant}-${protocol}${width:+-w$width}-p${probe}.jsonl"
              echo "Restore variant: ${variant}; storage HTTP/2 negotiation: ${protocol}; download width: ${width:-adaptive}; slow-read probe: ${probe}"
              df -h .
              "$cli" restore boringcache/ferrum-edge \
                --entry "${CACHE_ENTRY}:fuzz/target" \
                --no-git --no-platform --fail-on-cache-miss --fail-on-cache-error
              pass=$((pass + 1))
            done
            done
            done
          done

      - name: Record archive phase resources
        if: always()
        env:
          PHASE_DIRECTORY: ${{ runner.temp }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          for path in sorted(Path(os.environ["PHASE_DIRECTORY"]).glob("restore-observability-*.jsonl")):
              print(f"Resource evidence: {path.name}")
              for line in path.read_text().splitlines():
                  event = json.loads(line)
                  if event.get("schema") == "archive_graph_phase.v1":
                      print(json.dumps({"duration_ms": event.get("duration_ms"),
                                        "lifecycle": event.get("lifecycle")}))
                  elif event.get("operation") in {"archive_graph_restore_workers",
                                                "restore_download_concurrency_adjustment"}:
                      print(json.dumps({"operation": event["operation"],
                                        "details": event.get("details")}))
          PY

      - name: Measure target files and inspect Cargo fingerprints
        run: |
          python3 - <<'PY'
          import collections
          import hashlib
          import json
          import os
          import re
          import stat
          from pathlib import Path

          root = Path("fuzz/target")
          records = []
          directories = collections.Counter()
          categories = collections.Counter()
          inodes = {}
          for directory, _, names in os.walk(root):
              for name in names:
                  path = Path(directory) / name
                  info = path.lstat()
                  if not stat.S_ISREG(info.st_mode):
                      continue
                  relative = path.relative_to(root)
                  record = {"path": str(relative), "bytes": info.st_size,
                            "allocated_bytes": info.st_blocks * 512,
                            "links": info.st_nlink, "mtime_ns": info.st_mtime_ns}
                  records.append(record)
                  inodes.setdefault((info.st_dev, info.st_ino), record)
                  directories[str(relative.parent)] += info.st_size
                  category = path.suffix or "extensionless"
                  if "/incremental/" in str(path):
                      category = "incremental"
                  categories[category] += info.st_size

          dependency_outputs = {}
          for record in records:
              path = Path(record["path"])
              if path.parent.name != "deps":
                  continue
              match = re.fullmatch(r"(.+)-[0-9a-f]{16}", path.name)
              if match:
                  dependency_outputs[(str(path.parent.parent), match[1], record["bytes"])] = record
          duplicate_outputs = []
          for record in records:
              path = Path(record["path"])
              if path.parent.name not in {"debug", "release"} or path.suffix:
                  continue
              other = dependency_outputs.get((str(path.parent), path.name, record["bytes"]))
              if other is None:
                  continue
              digests = []
              for candidate in (record, other):
                  with (root / candidate["path"]).open("rb") as file:
                      digests.append(hashlib.file_digest(file, "sha256").hexdigest())
              duplicate_outputs.append({"paths": [record["path"], other["path"]],
                                        "bytes_per_copy": record["bytes"],
                                        "same_content": digests[0] == digests[1],
                                        "sha256": digests})

          fingerprints = []
          for path in root.glob("**/.fingerprint/ferrum-edge*/*.json"):
              value = json.loads(path.read_text())
              fingerprints.append({"path": str(path.relative_to(root)),
                                   "value": value})
          freshness_path = root / ".boringcache/cargo-freshness-v2.json"
          freshness = json.loads(freshness_path.read_text())
          lease = [entry for entry in freshness["entries"]
                   if bytes.fromhex(entry["path_bytes_hex"]).decode() == "src/tls/lease.rs"]
          result = {
              "source_commit": "558a3ccd412c285c20c609be3460fdbf6947040d",
              "file_count": len(records),
              "logical_bytes": sum(item["bytes"] for item in records),
              "unique_inode_bytes": sum(item["bytes"] for item in inodes.values()),
              "allocated_bytes": sum(item["allocated_bytes"] for item in inodes.values()),
              "hardlinked_files": sum(item["links"] > 1 for item in records),
              "duplicate_outputs": duplicate_outputs,
              "directories": directories.most_common(),
              "categories": categories.most_common(),
              "largest_files": sorted(records, key=lambda item: item["bytes"], reverse=True)[:40],
              "files": records,
              "fingerprints": fingerprints,
              "lease_source_freshness": lease,
          }
          Path("fuzz-cache-inspection.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps({key: value for key, value in result.items()
                            if key not in {"files", "fingerprints"}}, indent=2))
          PY
          du -h -d 3 fuzz/target | sort -h | tail -n 20

      - name: Upload inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: fuzz-cache-inspection
          path: fuzz-cache-inspection.json
          retention-days: 7
