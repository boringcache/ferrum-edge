          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name fips-producer \
            --hit false \
            --bytes 0 \
            --note "layer=producer; force_cold_cache skipped restore"
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name fips-handoff \
            --hit false \
            --bytes 0 \
            --note "layer=cross-attempt-handoff; force_cold_cache skipped save"

      - name: Require this-run FIPS producer cache
        if: github.event.inputs.force_cold_cache != 'true' && github.event.pull_request.head.repo.fork != true
        env:
          MATCHED: ${{ steps.fips-producer.outputs.cache-matched-key }}
          PREFIX: ${{ env.FIPS_PRODUCER_RESTORE_PREFIX }}
        run: |
          set -euo pipefail
          case "$MATCHED" in
            "$PREFIX"*)
              echo "Restored this-run FIPS producer cache."
              ;;
            *)
              echo "::error::fips-compile producer cache was not restored for this github.sha/run_id; refusing to claim compile-to-consumer reuse" >&2
              exit 1
              ;;
          esac

      - name: Assert cache-service credentials are absent
        run: |
          set -euo pipefail
          leaked=0
          for var in ACTIONS_RUNTIME_TOKEN ACTIONS_RESULTS_URL ACTIONS_CACHE_URL; do
            if [ -n "${!var:-}" ]; then
              echo "::error::${var} is present in this run environment; refusing to execute later PR-controlled build steps with a cache-service credential" >&2
              leaked=1
            fi
          done
          if [ "$leaked" -ne 0 ]; then
            exit 1
          fi

      # The filtered test consumer runs exact policy and handshake filters, but
      # Cargo must still build the complete unit_tests and integration_tests
      # binaries. Build those binaries in this producer-cache consumer so the
      # work overlaps claimed-profile and clippy jobs, then publish only
      # digest-bound copies through an immutable same-run artifact. Downstream
      # tests never ask Cargo to reconsider fresh-checkout mtimes.
      - name: Precompile FIPS test binaries for consumers
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py start --phase fips-test-build
          metadata="$(mktemp)"
          bundle="${GITHUB_WORKSPACE}/target/fips-test-bundle"
          set +e
          cargo test --locked --no-default-features --features fips \
            --test unit_tests --test integration_tests --no-run
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            set +e
            cargo test --locked --no-default-features --features fips \
              --test unit_tests --test integration_tests --no-run \
              --message-format=json > "$metadata"
            status=$?
            set -e
          fi
          if [ "$status" -eq 0 ]; then
            set +e
            python3 - "$metadata" "$bundle" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import sys

          metadata = Path(sys.argv[1])
          bundle = Path(sys.argv[2])
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          target_root = (workspace / "target").resolve(strict=True)
          wanted = {"unit_tests", "integration_tests"}
          found = {name: set() for name in wanted}

          for raw_line in metadata.read_text(encoding="utf-8").splitlines():
              try:
                  record = json.loads(raw_line)
              except json.JSONDecodeError:
                  continue
              if record.get("reason") != "compiler-artifact":
                  continue
              target = record.get("target") or {}
              name = target.get("name")
              executable = record.get("executable")
              if name not in wanted or not executable:
                  continue
              path = Path(executable).resolve(strict=True)
              path.relative_to(target_root)
              if not path.is_file() or not os.access(path, os.X_OK):
                  raise SystemExit(f"non-executable FIPS test artifact: {path}")
              found[name].add(path.relative_to(workspace).as_posix())

          invalid = {name: sorted(paths) for name, paths in found.items() if len(paths) != 1}
          if invalid:
              raise SystemExit(f"expected one executable per FIPS test target: {invalid}")

          if bundle.exists():
              shutil.rmtree(bundle)
          bundle.mkdir(mode=0o700)
          records = {}
          for name in sorted(wanted):
              source = workspace / next(iter(found[name]))
              destination = bundle / name
              shutil.copyfile(source, destination)
              destination.chmod(0o700)
              digest = hashlib.sha256()
              with destination.open("rb") as executable_file:
                  for chunk in iter(lambda: executable_file.read(1024 * 1024), b""):
                      digest.update(chunk)
              records[name] = {"file": name, "sha256": digest.hexdigest()}

          (bundle / "manifest.json").write_text(
              json.dumps(records, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
            status=$?
            set -e
          fi
          rm -f "$metadata"
          python3 .github/scripts/ci_runtime_telemetry.py end --phase fips-test-build --status "$status"
          exit "$status"

      - name: Publish exact FIPS test executables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fips-test-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/target/fips-test-bundle
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove staged FIPS test artifact
        run: rm -rf "${GITHUB_WORKSPACE}/target/fips-test-bundle"

      # Late cross-attempt handoff: full workspace target + sccache after the
      # last heavyweight target-producing job succeeds and the staged test
      # bundle is gone. Unique sha/run_id/run_attempt avoids immutable exact-hit
      # collisions. Saved as a main step so a failed producer cannot publish,
      # and after the consumer tail of this job so GitHub's LRU still sees the
      # archive as fresh for the next full-workflow rerun. Fork PRs and
      # force_cold_cache never publish it.
      - name: Save FIPS cross-attempt handoff
        if: github.event.inputs.force_cold_cache != 'true' && github.event.pull_request.head.repo.fork != true
        uses: actions/cache/save@374a27f26986edd8c430f386d152a856e179c0ae # v4.2.4
        with:
          path: |
            ${{ github.workspace }}/target
            ${{ github.workspace }}/.cache/sccache
          key: ${{ env.FIPS_HANDOFF_KEY }}

      - name: Record sccache stats
        if: always()
        run: |
          sccache_bin="${FERRUM_SCCACHE_BIN:-}"
          if [ -n "$sccache_bin" ] && [ -x "$sccache_bin" ]; then
            "$sccache_bin" --show-stats || true
          fi
          python3 .github/scripts/ci_runtime_telemetry.py summarize --title "FIPS test binaries"

  fips-test:
    name: FIPS tests
    needs: fips-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Initialize runtime telemetry
        run: python3 .github/scripts/ci_runtime_telemetry.py init --quiet

      - name: Download exact FIPS test executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fips-test-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fips-test-bundle

      - name: Assert cache-service credentials are absent
        run: |
          set -euo pipefail
          leaked=0
          for var in ACTIONS_RUNTIME_TOKEN ACTIONS_RESULTS_URL ACTIONS_CACHE_URL; do
            if [ -n "${!var:-}" ]; then
              echo "::error::${var} is present in this run environment; refusing to execute later PR-controlled build steps with a cache-service credential" >&2
              leaked=1
            fi
          done
          if [ "$leaked" -ne 0 ]; then
            exit 1
          fi

      - name: Validate restored FIPS test executables
        id: fips-test-binaries
        env:
          FIPS_TEST_BUNDLE: ${{ runner.temp }}/fips-test-bundle
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re

          bundle = Path(os.environ["FIPS_TEST_BUNDLE"]).resolve(strict=True)
          manifest_path = bundle / "manifest.json"
          if manifest_path.is_symlink():
              raise SystemExit("FIPS test manifest must not be a symlink")
          manifest = manifest_path.resolve(strict=True)
          if manifest.parent != bundle:
              raise SystemExit("FIPS test manifest escaped artifact root")
          records = json.loads(manifest.read_text(encoding="utf-8"))
          wanted = {"unit_tests", "integration_tests"}
          if not isinstance(records, dict) or set(records) != wanted:
              raise SystemExit(f"unexpected FIPS test manifest keys: {sorted(records)}")

          validated = {}
          for name in sorted(wanted):
              record = records[name]
              if not isinstance(record, dict) or set(record) != {"file", "sha256"}:
                  raise SystemExit(f"invalid FIPS test manifest record for {name}")
              if record["file"] != name:
                  raise SystemExit(f"unexpected FIPS test filename for {name}")
              expected = record["sha256"]
              if not isinstance(expected, str) or re.fullmatch(r"[0-9a-f]{64}", expected) is None:
                  raise SystemExit(f"invalid FIPS test digest for {name}")
              candidate_path = bundle / name
              if candidate_path.is_symlink():
                  raise SystemExit(f"FIPS test artifact must not be a symlink: {name}")
              candidate = candidate_path.resolve(strict=True)
              candidate.relative_to(bundle)
              if not candidate.is_file():
                  raise SystemExit(f"restored FIPS test artifact is not a regular file: {candidate}")
              digest = hashlib.sha256()
              with candidate.open("rb") as executable_file:
                  for chunk in iter(lambda: executable_file.read(1024 * 1024), b""):
                      digest.update(chunk)
              if digest.hexdigest() != expected:
                  raise SystemExit(f"FIPS test artifact digest mismatch: {name}")
              candidate.chmod(0o700)
              if not os.access(candidate, os.X_OK):
                  raise SystemExit(f"FIPS test artifact is not executable: {candidate}")
              validated[name] = candidate.as_posix()

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"unit={validated['unit_tests']}\n")
              output.write(f"integration={validated['integration_tests']}\n")
          PY

      - name: FIPS policy, key-admission, and handshake tests
        # libtest accepts one TESTNAME filter per invocation. `tls::fips_` selects
        # tls::fips_policy_tests and tls::fips_key_admission_tests (the only
        # tls::fips_* unit modules). Handshake coverage is two named tests in
        # the same restored integration_tests binary:
        # frontend_and_backend_builders_complete_a_real_tls_handshake
        # and legitimate_data_plane_connects_once_a_permit_is_released.
        env:
          UNIT_TEST_BINARY: ${{ steps.fips-test-binaries.outputs.unit }}
          INTEGRATION_TEST_BINARY: ${{ steps.fips-test-binaries.outputs.integration }}
        run: |
          set -euo pipefail
          unit_test_binary="$UNIT_TEST_BINARY"
          integration_test_binary="$INTEGRATION_TEST_BINARY"
          python3 .github/scripts/ci_runtime_telemetry.py start --phase fips-unit-tests
          set +e
          "$unit_test_binary" tls::fips_
          status=$?
          set -e
          python3 .github/scripts/ci_runtime_telemetry.py end --phase fips-unit-tests --status "$status"
          [ "$status" -eq 0 ] || exit "$status"

          python3 .github/scripts/ci_runtime_telemetry.py start --phase fips-handshake-tests
          set +e
          "$integration_test_binary" \
            integration::cp_grpc_handshake_admission_tests::frontend_and_backend_builders_complete_a_real_tls_handshake
          status=$?
          set -e
          python3 .github/scripts/ci_runtime_telemetry.py end --phase fips-handshake-tests --status "$status"
          [ "$status" -eq 0 ] || exit "$status"

          python3 .github/scripts/ci_runtime_telemetry.py start --phase fips-handshake-permit-tests
          set +e
          "$integration_test_binary" \
            integration::cp_grpc_handshake_admission_tests::legitimate_data_plane_connects_once_a_permit_is_released
          status=$?
          set -e
          python3 .github/scripts/ci_runtime_telemetry.py end --phase fips-handshake-permit-tests --status "$status"
          exit "$status"

      - name: Record FIPS test timings
        if: always()
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py summarize --title "FIPS tests"

  fips-build:
    name: FIPS Build & Test
    runs-on: ubuntu-latest
    needs:
      - fips-plan
      - fips-compile
      - fips-claimed-checks
      - fips-clippy
      - fips-test-build
      - fips-test
    if: always()
    steps:
      - name: Fail when FIPS planning fails
        if: needs.fips-plan.result != 'success'
        run: exit 1

      - name: Fail when FIPS planner output is unusable
        if: needs.fips-plan.result == 'success' && needs.fips-plan.outputs.relevant != 'true' && needs.fips-plan.outputs.relevant != 'false'
        run: exit 1

      - name: Skip expensive FIPS compile for unrelated changes
        if: needs.fips-plan.outputs.relevant == 'false'
        run: |
          {
            echo "## FIPS Build & Test"
            echo ""
            echo "No FIPS-sensitive paths changed. Feature policy still ran."
            echo "Compile, claimed-check, clippy, test-binary, and handshake jobs were skipped."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when FIPS compile did not succeed
        if: needs.fips-plan.outputs.relevant == 'true' && needs.fips-compile.result != 'success'
        run: exit 1

      - name: Fail when FIPS claimed-profile checks did not succeed
        if: needs.fips-plan.outputs.relevant == 'true' && needs.fips-claimed-checks.result != 'success'
        run: exit 1

      - name: Fail when FIPS clippy did not succeed
        if: needs.fips-plan.outputs.relevant == 'true' && needs.fips-clippy.result != 'success'
        run: exit 1

      - name: Fail when FIPS test-binary compile did not succeed
        if: needs.fips-plan.outputs.relevant == 'true' && needs.fips-test-build.result != 'success'
        run: exit 1

      - name: Fail when FIPS tests did not succeed
        if: needs.fips-plan.outputs.relevant == 'true' && needs.fips-test.result != 'success'
        run: exit 1

      - name: Report FIPS compile gate
        if: needs.fips-plan.outputs.relevant == 'true'
        run: |
          {
            echo "## FIPS Build & Test"
            echo ""
            echo "Compile, claimed-profile checks, clippy \`-D warnings\`, "
            echo "test-binary precompile, and policy/key-admission/handshake "
            echo "tests passed."
            echo ""
            echo "Compile published this-run producer cache "
            echo "(sha + run_id + run_attempt) after the locked fips profile "
            echo "build. Claimed checks, clippy, and test-binary compile restored "
            echo "that exact same-run channel in parallel. fips-test-build then "
            echo "saved the late cross-attempt handoff after removing the staged "
            echo "test bundle, so the next attempt's compile can restore the "
            echo "same sha + run_id lineage. Tests executed digest-bound "
            echo "binaries from the immutable same-run artifact published by "
            echo "fips-test-build. Stable rust-cache remains the cross-commit "
            echo "fallback."
            echo ""
            echo "Warm PR target: <=30 minutes, p95 <=45 minutes, measured on hosted runs."
          } >> "$GITHUB_STEP_SUMMARY"
