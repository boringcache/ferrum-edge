name: FIPS Build Policy

# FIPS deployment-mode gate for issue #3510, with CI runtime caching for #3888.
#
# Jobs:
#
# 1. `feature-policy` is the cheap REQUIRED graph audit. It reads `Cargo.toml`
#    and the resolved feature graph for both profiles and fails when a ring
#    feature could still be in control of a nominal FIPS build.
# 2. `fips-plan` decides whether the expensive compile/clippy/test jobs run.
#    The planner is read from the trusted base; a missing or unknown planner
#    fails closed toward running the live compile gate.
# 3. `fips-compile` builds the FIPS binary and every claimed feature combination
#    once, then publishes two cache layers before clippy/test start:
#    - Stable rust-cache fallback: `shared-key` is
#      `ci-fips-contract-${{ hashFiles(...) }}` (the input the pinned
#      Swatinem/rust-cache actually uses; a sibling `key:` input is ignored
#      whenever `shared-key` is set and must not appear). Automatic
#      toolchain/env/manifest/lock hashing stays enabled. This layer is NOT
#      SHA-scoped, so dependency/compiler work stays warm across commits.
#    - Exact producer channel: `actions/cache` key
#      `fips-producer-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}`.
#      Compile restores the newest prior attempt for the same SHA + run_id,
#      then saves the current attempt after a successful build as a main step,
#      before rust-cache's post cleanup. A new attempt always gets a fresh key,
#      so GitHub's immutable exact-hit skip cannot trap newly warmed outputs.
#    Fork pull requests restore both layers and cannot save. `force_cold_cache`
#    skips every restore and save. Abrupt loss of the producer cannot publish
#    that producer's unsaved state.
# 4. `fips-clippy` and `fips-test` restore the same producer key (consumers;
#    rust-cache `save-if: false` and no producer save). Trusted non-cold runs
#    fail closed if this-run producer output is missing. restore-keys keep
#    `fips-producer-${{ github.sha }}-${{ github.run_id }}-` so a failed-job
#    rerun can reuse a prior attempt of the same run.
# 5. `fips-build` keeps the `FIPS Build & Test` check name and fails closed.
#
# Ferrum Edge is not a validated cryptographic module and is not independently
# FIPS-certified. A green run here means the FIPS profile builds, links the
# selected AWS-LC FIPS implementation, passes its approved-mode self-test, and
# refuses every non-approved algorithm. It does not prove that the artifact and
# operating environment fall under a CMVP certificate. See docs/fips.md.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      force_cold_cache:
        description: Skip cache restore to prove cold-path FIPS contracts
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fips-build-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  FERRUM_CI_FORCE_COLD_CACHE: ${{ github.event.inputs.force_cold_cache == 'true' }}
  # Exact compile-to-consumer channel. Unique per SHA + workflow run + attempt
  # so a source-only change can publish freshly warmed Cargo/target/AWS-LC/
  # sccache state. restore-keys use the SHA+run_id prefix (no attempt) so a
  # failed-job rerun can reuse a prior successful compile in the same run.
  FIPS_PRODUCER_KEY: fips-producer-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
  FIPS_PRODUCER_RESTORE_PREFIX: fips-producer-${{ github.sha }}-${{ github.run_id }}-

jobs:
  feature-policy:
    name: FIPS Feature Policy
    runs-on: ubuntu-latest
    # This job does not install sccache, so clear the checked-in rustc wrapper
    # from `.cargo/config.toml` rather than exec'ing a missing tool.
    env:
      RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Static manifest contract
        run: python3 .github/scripts/check_fips_feature_policy.py --manifest-check

      - name: Resolve the ordinary (crypto-ring) feature graph
        run: |
          cargo tree --color never -e normal,build --prefix none \
            -f '{p}|{f}' --locked > /tmp/tree-crypto-ring.txt

      - name: Audit the ordinary feature graph
        run: |
          python3 .github/scripts/check_fips_feature_policy.py \
            --tree /tmp/tree-crypto-ring.txt --profile crypto-ring

      - name: Audit every claimed FIPS feature combination
        # Feature resolution alone does not build `aws-lc-fips-sys`, so this
        # needs no C/Go toolchain. The committed lockfile pins this profile too.
        #
        # The combinations are enumerated by the checker itself
        # (`--list-claimed-profiles`) rather than duplicated in YAML, so a new
        # optional feature cannot be claimed as FIPS-clean in one place and go
        # unaudited in the other. `check_claimed_profiles_declared()` in the
        # static manifest step above additionally fails when an optional cargo
        # feature is named by no claimed profile at all — an unlisted feature is
        # an implicit support claim, which is exactly what this gate refuses.
        run: |
          set -euo pipefail
          status=0
          while IFS=$'\t' read -r label features; do
            [ -n "$features" ] || continue
            echo "::group::FIPS feature graph — ${label}"
            slug="$(printf '%s' "$features" | tr ',' '-')"
            cargo tree --color never -e normal,build --prefix none \
              -f '{p}|{f}' --locked \
              --no-default-features --features "$features" \
              > "/tmp/tree-${slug}.txt"
            if ! python3 .github/scripts/check_fips_feature_policy.py \
                --tree "/tmp/tree-${slug}.txt" --profile fips; then
              echo "::error::FIPS feature-graph audit failed for ${label} (--features ${features})"
              status=1
            fi
            echo "::endgroup::"
          done < <(python3 .github/scripts/check_fips_feature_policy.py --list-claimed-profiles)
          exit "$status"

  fips-plan:
    name: FIPS compile trigger
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for FIPS compile changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail

          filter_path=.github/scripts/ci_runtime_plan.py
          changed_files="$RUNNER_TEMP/fips-build-changed-files.txt"
          trusted_filter="$RUNNER_TEMP/fips-build-trusted-filter.py"
          rm -f -- "$changed_files" "$trusted_filter"
          : > "$changed_files"

          filter_args=(--suite fips-build --changed-files "$changed_files")

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! printf '%s' "$BASE_REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,200}$'; then
              echo "::error::refusing to resolve an unsafe base ref" >&2
              exit 1
            fi
            case "$BASE_REF" in
              *..*|*//*|*/|*.lock|*/.*)
                echo "::error::refusing to resolve an unsafe base ref" >&2
                exit 1
                ;;
            esac
            fetched=false
            for attempt in 1 2 3; do
              if git fetch --no-tags --no-recurse-submodules origin \
                "+refs/heads/${BASE_REF}:refs/ferrum/trusted-base"; then
                fetched=true
                break
              fi
              echo "git fetch of ${BASE_REF} failed (attempt ${attempt}/3); retrying" >&2
              sleep $(( attempt * 10 ))
            done
            if [ "$fetched" != true ]; then
              echo "::error::git fetch of ${BASE_REF} failed after 3 attempts" >&2
              exit 1
            fi
            trusted_sha="$(git rev-parse --verify --quiet refs/ferrum/trusted-base^{commit} || true)"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            if ! printf '%s' "$MERGE_BASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::merge_group base_sha missing or malformed" >&2
              exit 1
            fi
            if ! git cat-file -e "${MERGE_BASE_SHA}^{commit}" 2>/dev/null; then
              fetched=false
              for attempt in 1 2 3; do
                if git fetch --no-tags --no-recurse-submodules origin \
                  "${MERGE_BASE_SHA}"; then
                  fetched=true
                  break
                fi
                echo "git fetch of merge_group base failed (attempt ${attempt}/3); retrying" >&2
                sleep $(( attempt * 10 ))
              done
              if [ "$fetched" != true ]; then
                echo "::error::git fetch of merge_group base_sha failed after 3 attempts" >&2
                exit 1
              fi
            fi
            trusted_sha="$MERGE_BASE_SHA"
          else
            trusted_sha="$(git rev-parse --verify --quiet 'HEAD^{commit}' || true)"
            filter_args+=(--force-run)
          fi

          if ! printf '%s' "$trusted_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::trusted base did not resolve to a full commit id" >&2
            exit 1
          fi

          if ! git cat-file -e "${trusted_sha}:${filter_path}" 2>/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "trusted base has not adopted ${filter_path}; running the full gate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          entry="$(git ls-tree --full-tree "$trusted_sha" -- "$filter_path")"
          if [ "$(printf '%s\n' "$entry" | grep -c . || true)" != "1" ]; then
            echo "::error::${filter_path} is not a single tree entry at ${trusted_sha}" >&2
            exit 1
          fi
          entry_mode="$(printf '%s\n' "$entry" | awk '{print $1}')"
          entry_type="$(printf '%s\n' "$entry" | awk '{print $2}')"
          entry_object="$(printf '%s\n' "$entry" | awk '{print $3}')"
          entry_path="$(printf '%s\n' "$entry" | awk -F'\t' '{print $2}')"
          if [ "$entry_type" != "blob" ] || [ "$entry_path" != "$filter_path" ]; then
            echo "::error::${filter_path} is not a blob at ${trusted_sha}" >&2
            exit 1
          fi
          case "$entry_mode" in
            100644|100755) ;;
            *)
              echo "::error::${filter_path} has non-regular mode ${entry_mode}" >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$entry_object" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::${filter_path} did not resolve to an object id" >&2
            exit 1
          fi
          if [ "$(git cat-file -s "$entry_object")" -gt 262144 ]; then
            echo "::error::${filter_path} exceeds the 256 KiB trusted-filter ceiling" >&2
            exit 1
          fi
          git cat-file blob "$entry_object" > "$trusted_filter"

          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; then
            git diff --name-only --no-renames -z "${trusted_sha}...HEAD" \
              > "$changed_files"
          fi

          python3 -I "$trusted_filter" --self-test
          plan="$(python3 -I "$trusted_filter" "${filter_args[@]}")"
          relevant="$(printf '%s\n' "$plan" | sed -n 's/^relevant=//p')"
          case "$relevant" in
            true|false) ;;
            *)
              echo "::error::trusted relevance filter produced no usable verdict" >&2
              exit 1
              ;;
          esac
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Relevance decided by trusted base ${trusted_sha}." >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$plan" | sed -n '/^## /,$p' >> "$GITHUB_STEP_SUMMARY"

  fips-compile:
    name: FIPS compile
    needs: fips-plan
    if: needs.fips-plan.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Initialize runtime telemetry
        run: python3 .github/scripts/ci_runtime_telemetry.py init --quiet

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: ./.github/actions/setup-sccache

      - name: Install aws-lc-fips-sys build prerequisites
        # The FIPS build of AWS-LC is compiled through the upstream crate's
        # source-build path. This is a functional CI gate; certificate
        # applicability still depends on the vendor security policy and the
        # deployment's exact module version and operating environment.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build golang-go libcurl4-openssl-dev protobuf-compiler

      - uses: ./.github/actions/setup-fast-linker

      # Stable dependency/compiler fallback. The contract discriminator lives in
      # `shared-key` because pinned rust-cache ignores `key` whenever
      # `shared-key` is set. Do not add `key:` or `add-job-id-key`. Automatic
      # env/manifest/lock hashing remains enabled. This key is not SHA-scoped.
      - name: Cache FIPS Rust, AWS-LC, and sccache outputs
        if: github.event.inputs.force_cold_cache != 'true'
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-fips-contract-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/config.toml', 'build.rs', '.github/workflows/fips-build.yml', '.github/scripts/check_fips_feature_policy.py', 'src/fips/**', 'vendor/**') }}
          cache-directories: ${{ github.workspace }}/.cache/sccache
          cache-on-failure: "true"
          save-if: ${{ github.event.pull_request.head.repo.fork != true }}

      - name: Record rust-cache restore
        if: github.event.inputs.force_cold_cache != 'true'
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          FORK_PR: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name rust-cache \
            --hit "$CACHE_HIT" \
            --path "${GITHUB_WORKSPACE}/.cache/sccache" \
            --note "layer=stable-fallback; measured=sccache-directory-subset; rust-cache Cargo/target archive bytes are not exposed; shared-key=ci-fips-contract save-if=non-fork fork=${FORK_PR:-false}"

      # A full workflow rerun has a new run_attempt but the same SHA + run_id.
      # Restore the previous successful producer as the warm source for this
      # producer too; otherwise only clippy/tests consume the exact archive and
      # every alleged warm gate recompiles the producer from the pruned stable
      # fallback. A miss is valid on the first attempt and on fork PRs.
      - name: Restore prior-attempt FIPS producer outputs
        if: github.event.inputs.force_cold_cache != 'true'
        id: prior-fips-producer
        uses: actions/cache/restore@374a27f26986edd8c430f386d152a856e179c0ae # v4.2.4
        with:
          path: |
            ${{ github.workspace }}/target
            ${{ github.workspace }}/.cache/sccache
          key: ${{ env.FIPS_PRODUCER_KEY }}
          restore-keys: |
            ${{ env.FIPS_PRODUCER_RESTORE_PREFIX }}

      - name: Record prior-attempt FIPS producer restore
        if: github.event.inputs.force_cold_cache != 'true'
        env:
          CACHE_HIT: ${{ steps.prior-fips-producer.outputs.cache-hit }}
          CACHE_MATCHED: ${{ steps.prior-fips-producer.outputs.cache-matched-key }}
          CACHE_PRIMARY: ${{ steps.prior-fips-producer.outputs.cache-primary-key }}
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py classify-restore \
            --name prior-fips-producer \
            --hit "$CACHE_HIT" \
            --matched "$CACHE_MATCHED" \
            --primary "$CACHE_PRIMARY" \
            --path "${GITHUB_WORKSPACE}/target" \
            --note "layer=producer-warm-source; measured=target-directory; optional prior-attempt restore for the same sha+run_id"

      - name: Record cold-cache proof
        if: github.event.inputs.force_cold_cache == 'true'
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name rust-cache \
            --hit false \
            --bytes 0 \
            --note "layer=stable-fallback; force_cold_cache skipped restore"
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name fips-producer \
            --hit false \
            --bytes 0 \
            --note "layer=producer; force_cold_cache skipped restore and save"

      - name: Assert cache-service credentials are absent
        run: |
          set -euo pipefail
          leaked=0
          for var in ACTIONS_RUNTIME_TOKEN ACTIONS_RESULTS_URL ACTIONS_CACHE_URL; do
            if [ -n "${!var:-}" ]; then
              echo "::error::${var} is present in this run environment; refusing to execute later PR-controlled build steps with a cache-service credential" >&2
              leaked=1
            fi
          done
          if [ "$leaked" -ne 0 ]; then
            exit 1
          fi

      - name: Build the FIPS profile
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py start --phase fips-build
          set +e
          cargo build --locked --no-default-features --features fips --bin ferrum-edge
          status=$?
          set -e
          python3 .github/scripts/ci_runtime_telemetry.py end --phase fips-build --status "$status"
          exit "$status"

      - name: Compile every crypto-relevant optional FIPS combination
        # `aws-lc-fips-sys` is already compiled by the step above and lives in
        # the same target directory, so these reuse it and cost roughly one
        # incremental check each. That is what keeps enumerating the claimed
        # profiles affordable rather than a matrix of full builds.
        #
        # `cargo check` is deliberate: the question here is whether the
        # combination's cryptography compiles against the selected module, not
        # whether it links a second binary. Linking is proven once, above.
        #
        # `cloud-secrets` is included even though it is REFUSED at runtime: the
        # combination must still build, so the refusal is what stands between it
        # and use rather than a compile error nobody would recognise as policy.
        # `fips_external_secret_tests` proves the refusal itself.
        run: |
          set -euo pipefail
          python3 .github/scripts/ci_runtime_telemetry.py start --phase fips-claimed-checks
          status=0
          while IFS=$'\t' read -r label features; do
            [ -n "$features" ] || continue
            echo "::group::cargo check — ${label}"
            if ! cargo check --locked --no-default-features --features "$features" \
              --lib --bins; then
              echo "::error::FIPS claimed-profile compile failed for ${label} (--features ${features})"
              status=1
            fi
            echo "::endgroup::"
          done < <(python3 .github/scripts/check_fips_feature_policy.py --list-claimed-profiles)
          python3 .github/scripts/ci_runtime_telemetry.py end --phase fips-claimed-checks --status "$status"
          exit "$status"

      # The consumer runs exact policy and handshake filters, but Cargo must
      # still build the complete unit_tests and integration_tests binaries.
      # Build those binaries once in the producer so downstream runners only
      # execute them after restoring the SHA-scoped target archive. This also
      # makes a runner-loss retry reuse the expensive test-only link outputs.
      - name: Precompile FIPS test binaries for consumers
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py start --phase fips-test-build
          metadata="$(mktemp)"
          manifest="${GITHUB_WORKSPACE}/target/fips-test-binaries.json"
          set +e
          cargo test --locked --no-default-features --features fips \
            --test unit_tests --test integration_tests --no-run
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            set +e
            cargo test --locked --no-default-features --features fips \
              --test unit_tests --test integration_tests --no-run \
              --message-format=json > "$metadata"
            status=$?
            set -e
          fi
          if [ "$status" -eq 0 ]; then
            set +e
            python3 - "$metadata" "$manifest" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          metadata = Path(sys.argv[1])
          manifest = Path(sys.argv[2])
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          target_root = (workspace / "target").resolve(strict=True)
          wanted = {"unit_tests", "integration_tests"}
          found = {name: set() for name in wanted}

          for raw_line in metadata.read_text(encoding="utf-8").splitlines():
              try:
                  record = json.loads(raw_line)
              except json.JSONDecodeError:
                  continue
              if record.get("reason") != "compiler-artifact":
                  continue
              target = record.get("target") or {}
              name = target.get("name")
              executable = record.get("executable")
              if name not in wanted or not executable:
                  continue
              path = Path(executable).resolve(strict=True)
              path.relative_to(target_root)
              if not path.is_file() or not os.access(path, os.X_OK):
                  raise SystemExit(f"non-executable FIPS test artifact: {path}")
              found[name].add(path.relative_to(workspace).as_posix())

          invalid = {name: sorted(paths) for name, paths in found.items() if len(paths) != 1}
          if invalid:
              raise SystemExit(f"expected one executable per FIPS test target: {invalid}")
          manifest.write_text(
              json.dumps({name: next(iter(found[name])) for name in sorted(wanted)}) + "\n",
              encoding="utf-8",
          )
          PY
            status=$?
            set -e
          fi
          rm -f "$metadata"
          python3 .github/scripts/ci_runtime_telemetry.py end --phase fips-test-build --status "$status"
          exit "$status"

      # Exact producer archive: full workspace target + sccache as left by this
      # successful compile. Saved as a main step so rust-cache's later post
      # cleanup (which strips workspace crates) cannot empty it. Unique
      # sha/run_id/run_attempt avoids immutable exact-hit collisions.
      - name: Save FIPS producer compile outputs
        if: github.event.inputs.force_cold_cache != 'true' && github.event.pull_request.head.repo.fork != true
        uses: actions/cache/save@374a27f26986edd8c430f386d152a856e179c0ae # v4.2.4
        with:
          path: |
            ${{ github.workspace }}/target
            ${{ github.workspace }}/.cache/sccache
          key: ${{ env.FIPS_PRODUCER_KEY }}

      - name: Record sccache stats
        if: always()
        run: |
          sccache_bin="${FERRUM_SCCACHE_BIN:-}"
          if [ -n "$sccache_bin" ] && [ -x "$sccache_bin" ]; then
            "$sccache_bin" --show-stats || true
          fi
          python3 .github/scripts/ci_runtime_telemetry.py summarize --title "FIPS compile"

  fips-clippy:
    name: FIPS clippy
    needs: fips-compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Initialize runtime telemetry
        run: python3 .github/scripts/ci_runtime_telemetry.py init --quiet

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - uses: ./.github/actions/setup-sccache

      - name: Install aws-lc-fips-sys build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build golang-go libcurl4-openssl-dev protobuf-compiler

      - uses: ./.github/actions/setup-fast-linker

      - name: Cache FIPS Rust, AWS-LC, and sccache outputs
        if: github.event.inputs.force_cold_cache != 'true'
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-fips-contract-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/config.toml', 'build.rs', '.github/workflows/fips-build.yml', '.github/scripts/check_fips_feature_policy.py', 'src/fips/**', 'vendor/**') }}
          cache-directories: ${{ github.workspace }}/.cache/sccache
          cache-on-failure: "true"
          save-if: "false"

      - name: Record rust-cache restore
        if: github.event.inputs.force_cold_cache != 'true'
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          FORK_PR: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name rust-cache \
            --hit "$CACHE_HIT" \
            --path "${GITHUB_WORKSPACE}/.cache/sccache" \
            --note "layer=stable-fallback; measured=sccache-directory-subset; rust-cache Cargo/target archive bytes are not exposed; save-if=false fork=${FORK_PR:-false}"

      - name: Drop stable target before producer restore
        if: github.event.inputs.force_cold_cache != 'true' && github.event.pull_request.head.repo.fork != true
        run: |
          set -euo pipefail
          rm -rf "${GITHUB_WORKSPACE}/target" "${GITHUB_WORKSPACE}/.cache/sccache"

      - name: Restore FIPS producer compile outputs
        if: github.event.inputs.force_cold_cache != 'true'
        id: fips-producer
        uses: actions/cache/restore@374a27f26986edd8c430f386d152a856e179c0ae # v4.2.4
        with:
          path: |
            ${{ github.workspace }}/target
            ${{ github.workspace }}/.cache/sccache
          key: ${{ env.FIPS_PRODUCER_KEY }}
          restore-keys: |
            ${{ env.FIPS_PRODUCER_RESTORE_PREFIX }}
          fail-on-cache-miss: ${{ github.event.pull_request.head.repo.fork != true }}

      - name: Record FIPS producer restore
        if: github.event.inputs.force_cold_cache != 'true'
        env:
          CACHE_HIT: ${{ steps.fips-producer.outputs.cache-hit }}
          CACHE_MATCHED: ${{ steps.fips-producer.outputs.cache-matched-key }}
          CACHE_PRIMARY: ${{ steps.fips-producer.outputs.cache-primary-key }}
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py classify-restore \
            --name fips-producer \
            --hit "$CACHE_HIT" \
            --matched "$CACHE_MATCHED" \
            --primary "$CACHE_PRIMARY" \
            --path "${GITHUB_WORKSPACE}/target" \
            --note "layer=producer; measured=target-directory; sccache restored with the same producer key"

      - name: Record cold-cache proof
        if: github.event.inputs.force_cold_cache == 'true'
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name rust-cache \
            --hit false \
            --bytes 0 \
            --note "layer=stable-fallback; force_cold_cache skipped restore"
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name fips-producer \
            --hit false \
            --bytes 0 \
            --note "layer=producer; force_cold_cache skipped restore"

      - name: Require this-run FIPS producer cache
        if: github.event.inputs.force_cold_cache != 'true' && github.event.pull_request.head.repo.fork != true
        env:
          MATCHED: ${{ steps.fips-producer.outputs.cache-matched-key }}
          PREFIX: ${{ env.FIPS_PRODUCER_RESTORE_PREFIX }}
        run: |
          set -euo pipefail
          case "$MATCHED" in
            "$PREFIX"*)
              echo "Restored this-run FIPS producer cache."
              ;;
            *)
              echo "::error::fips-compile producer cache was not restored for this github.sha/run_id; refusing to claim compile-to-consumer reuse" >&2
              exit 1
              ;;
          esac

      - name: Assert cache-service credentials are absent
        run: |
          set -euo pipefail
          leaked=0
          for var in ACTIONS_RUNTIME_TOKEN ACTIONS_RESULTS_URL ACTIONS_CACHE_URL; do
            if [ -n "${!var:-}" ]; then
              echo "::error::${var} is present in this run environment; refusing to execute later PR-controlled build steps with a cache-service credential" >&2
              leaked=1
            fi
          done
          if [ "$leaked" -ne 0 ]; then
            exit 1
          fi

      - name: Lint the FIPS profile
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py start --phase fips-clippy
          set +e
          cargo clippy --locked --no-default-features --features fips \
            --lib --tests -p ferrum-edge -- -D warnings
          status=$?
          set -e
          python3 .github/scripts/ci_runtime_telemetry.py end --phase fips-clippy --status "$status"
          exit "$status"

      - name: Record sccache stats
        if: always()
        run: |
          sccache_bin="${FERRUM_SCCACHE_BIN:-}"
          if [ -n "$sccache_bin" ] && [ -x "$sccache_bin" ]; then
            "$sccache_bin" --show-stats || true
          fi
          python3 .github/scripts/ci_runtime_telemetry.py summarize --title "FIPS clippy"

  fips-test:
    name: FIPS tests
    needs: fips-compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Initialize runtime telemetry
        run: python3 .github/scripts/ci_runtime_telemetry.py init --quiet

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: ./.github/actions/setup-sccache

      - name: Install aws-lc-fips-sys build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build golang-go libcurl4-openssl-dev protobuf-compiler

      - uses: ./.github/actions/setup-fast-linker

      - name: Cache FIPS Rust, AWS-LC, and sccache outputs
        if: github.event.inputs.force_cold_cache != 'true'
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-fips-contract-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/config.toml', 'build.rs', '.github/workflows/fips-build.yml', '.github/scripts/check_fips_feature_policy.py', 'src/fips/**', 'vendor/**') }}
          cache-directories: ${{ github.workspace }}/.cache/sccache
          cache-on-failure: "true"
          save-if: "false"

      - name: Record rust-cache restore
        if: github.event.inputs.force_cold_cache != 'true'
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          FORK_PR: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name rust-cache \
            --hit "$CACHE_HIT" \
            --path "${GITHUB_WORKSPACE}/.cache/sccache" \
            --note "layer=stable-fallback; measured=sccache-directory-subset; rust-cache Cargo/target archive bytes are not exposed; save-if=false fork=${FORK_PR:-false}"

      - name: Drop stable target before producer restore
        if: github.event.inputs.force_cold_cache != 'true' && github.event.pull_request.head.repo.fork != true
        run: |
          set -euo pipefail
          rm -rf "${GITHUB_WORKSPACE}/target" "${GITHUB_WORKSPACE}/.cache/sccache"

      - name: Restore FIPS producer compile outputs
        if: github.event.inputs.force_cold_cache != 'true'
        id: fips-producer
        uses: actions/cache/restore@374a27f26986edd8c430f386d152a856e179c0ae # v4.2.4
        with:
          path: |
            ${{ github.workspace }}/target
            ${{ github.workspace }}/.cache/sccache
          key: ${{ env.FIPS_PRODUCER_KEY }}
          restore-keys: |
            ${{ env.FIPS_PRODUCER_RESTORE_PREFIX }}
          fail-on-cache-miss: ${{ github.event.pull_request.head.repo.fork != true }}

      - name: Record FIPS producer restore
        if: github.event.inputs.force_cold_cache != 'true'
        env:
          CACHE_HIT: ${{ steps.fips-producer.outputs.cache-hit }}
          CACHE_MATCHED: ${{ steps.fips-producer.outputs.cache-matched-key }}
          CACHE_PRIMARY: ${{ steps.fips-producer.outputs.cache-primary-key }}
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py classify-restore \
            --name fips-producer \
            --hit "$CACHE_HIT" \
            --matched "$CACHE_MATCHED" \
            --primary "$CACHE_PRIMARY" \
            --path "${GITHUB_WORKSPACE}/target" \
            --note "layer=producer; measured=target-directory; sccache restored with the same producer key"

      - name: Record cold-cache proof
        if: github.event.inputs.force_cold_cache == 'true'
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name rust-cache \
            --hit false \
            --bytes 0 \
            --note "layer=stable-fallback; force_cold_cache skipped restore"
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name fips-producer \
            --hit false \
            --bytes 0 \
            --note "layer=producer; force_cold_cache skipped restore"

      - name: Require this-run FIPS producer cache
        if: github.event.inputs.force_cold_cache != 'true' && github.event.pull_request.head.repo.fork != true
        env:
          MATCHED: ${{ steps.fips-producer.outputs.cache-matched-key }}
          PREFIX: ${{ env.FIPS_PRODUCER_RESTORE_PREFIX }}
        run: |
          set -euo pipefail
          case "$MATCHED" in
            "$PREFIX"*)
              echo "Restored this-run FIPS producer cache."
              ;;
            *)
              echo "::error::fips-compile producer cache was not restored for this github.sha/run_id; refusing to claim compile-to-consumer reuse" >&2
              exit 1
              ;;
          esac

      - name: Assert cache-service credentials are absent
        run: |
          set -euo pipefail
          leaked=0
          for var in ACTIONS_RUNTIME_TOKEN ACTIONS_RESULTS_URL ACTIONS_CACHE_URL; do
            if [ -n "${!var:-}" ]; then
              echo "::error::${var} is present in this run environment; refusing to execute later PR-controlled build steps with a cache-service credential" >&2
              leaked=1
            fi
          done
          if [ "$leaked" -ne 0 ]; then
            exit 1
          fi

      - name: Validate restored FIPS test executables
        id: fips-test-binaries
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          target_root = (workspace / "target").resolve(strict=True)
          manifest = (target_root / "fips-test-binaries.json").resolve(strict=True)
          if manifest.parent != target_root:
              raise SystemExit("FIPS test manifest escaped target root")
          records = json.loads(manifest.read_text(encoding="utf-8"))
          wanted = {"unit_tests", "integration_tests"}
          if set(records) != wanted:
              raise SystemExit(f"unexpected FIPS test manifest keys: {sorted(records)}")

          validated = {}
          for name in sorted(wanted):
              relative = records[name]
              if not isinstance(relative, str) or not relative or "\n" in relative or "\r" in relative:
                  raise SystemExit(f"invalid FIPS test path for {name}")
              candidate = (workspace / relative).resolve(strict=True)
              candidate.relative_to(target_root)
              if not candidate.is_file() or not os.access(candidate, os.X_OK):
                  raise SystemExit(f"restored FIPS test artifact is not executable: {candidate}")
              validated[name] = candidate.relative_to(workspace).as_posix()

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"unit={validated['unit_tests']}\n")
              output.write(f"integration={validated['integration_tests']}\n")
          PY

      - name: FIPS policy, key-admission, and handshake tests
        # libtest accepts one TESTNAME filter per invocation. `tls::fips_` selects
        # tls::fips_policy_tests and tls::fips_key_admission_tests (the only
        # tls::fips_* unit modules). Handshake coverage is two named tests in
        # the same restored integration_tests binary:
        # frontend_and_backend_builders_complete_a_real_tls_handshake
        # and legitimate_data_plane_connects_once_a_permit_is_released.
        env:
          UNIT_TEST_BINARY: ${{ steps.fips-test-binaries.outputs.unit }}
          INTEGRATION_TEST_BINARY: ${{ steps.fips-test-binaries.outputs.integration }}
        run: |
          set -euo pipefail
          unit_test_binary="${GITHUB_WORKSPACE}/${UNIT_TEST_BINARY}"
          integration_test_binary="${GITHUB_WORKSPACE}/${INTEGRATION_TEST_BINARY}"
          python3 .github/scripts/ci_runtime_telemetry.py start --phase fips-unit-tests
          set +e
          "$unit_test_binary" tls::fips_
          status=$?
          set -e
          python3 .github/scripts/ci_runtime_telemetry.py end --phase fips-unit-tests --status "$status"
          [ "$status" -eq 0 ] || exit "$status"

          python3 .github/scripts/ci_runtime_telemetry.py start --phase fips-handshake-tests
          set +e
          "$integration_test_binary" \
            integration::cp_grpc_handshake_admission_tests::frontend_and_backend_builders_complete_a_real_tls_handshake
          status=$?
          set -e
          python3 .github/scripts/ci_runtime_telemetry.py end --phase fips-handshake-tests --status "$status"
          [ "$status" -eq 0 ] || exit "$status"

          python3 .github/scripts/ci_runtime_telemetry.py start --phase fips-handshake-permit-tests
          set +e
          "$integration_test_binary" \
            integration::cp_grpc_handshake_admission_tests::legitimate_data_plane_connects_once_a_permit_is_released
          status=$?
          set -e
          python3 .github/scripts/ci_runtime_telemetry.py end --phase fips-handshake-permit-tests --status "$status"
          exit "$status"

      - name: Record sccache stats
        if: always()
        run: |
          sccache_bin="${FERRUM_SCCACHE_BIN:-}"
          if [ -n "$sccache_bin" ] && [ -x "$sccache_bin" ]; then
            "$sccache_bin" --show-stats || true
          fi
          python3 .github/scripts/ci_runtime_telemetry.py summarize --title "FIPS tests"

  fips-build:
    name: FIPS Build & Test
    runs-on: ubuntu-latest
    needs:
      - fips-plan
      - fips-compile
      - fips-clippy
      - fips-test
    if: always()
    steps:
      - name: Fail when FIPS planning fails
        if: needs.fips-plan.result != 'success'
        run: exit 1

      - name: Fail when FIPS planner output is unusable
        if: needs.fips-plan.result == 'success' && needs.fips-plan.outputs.relevant != 'true' && needs.fips-plan.outputs.relevant != 'false'
        run: exit 1

      - name: Skip expensive FIPS compile for unrelated changes
        if: needs.fips-plan.outputs.relevant == 'false'
        run: |
          {
            echo "## FIPS Build & Test"
            echo ""
            echo "No FIPS-sensitive paths changed. Feature policy still ran."
            echo "Compile, clippy, and handshake jobs were skipped."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when FIPS compile did not succeed
        if: needs.fips-plan.outputs.relevant == 'true' && needs.fips-compile.result != 'success'
        run: exit 1

      - name: Fail when FIPS clippy did not succeed
        if: needs.fips-plan.outputs.relevant == 'true' && needs.fips-clippy.result != 'success'
        run: exit 1

      - name: Fail when FIPS tests did not succeed
        if: needs.fips-plan.outputs.relevant == 'true' && needs.fips-test.result != 'success'
        run: exit 1

      - name: Report FIPS compile gate
        if: needs.fips-plan.outputs.relevant == 'true'
        run: |
          {
            echo "## FIPS Build & Test"
            echo ""
            echo "Compile, claimed-profile checks, clippy \`-D warnings\`, and"
            echo "policy/key-admission/handshake tests passed."
            echo ""
            echo "Compile published this-run producer cache "
            echo "(sha + run_id + run_attempt); clippy/test restored that exact "
            echo "channel. Stable rust-cache remains the cross-commit fallback."
            echo ""
            echo "Warm PR target: <=30 minutes, p95 <=45 minutes, measured on hosted runs."
          } >> "$GITHUB_STEP_SUMMARY"
