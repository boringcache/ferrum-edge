name: NodeWaypoint eBPF Live Datapath

# Optional always-reporting live datapath. `NodeWaypoint eBPF Live` is NOT a
# branch-protection-required check: it reports on every run — green when the
# suite passed or the trusted-base classifier proved irrelevance, red when the
# classifier failed closed, the production-image contract failed, or a relevant
# live job failed.
#
# There is deliberately no workflow-level `paths:` filter (issue #3908): a
# filter that ships in the pull request's own checkout can be widened by the
# same commit that breaks the surface it guards, and a `paths:`-only trigger
# never re-evaluates a merge-queue combination or a push to `main`.
#
# Two trusted-base classifiers share this workflow, and neither can bypass the
# other:
#   * `changes` decides WHOLE-SUITE relevance for the Kind/eBPF live datapath
#     from the base branch's `.github/scripts/live_suite_path_filter.py`
#     (`--suite node-waypoint-ebpf`). That block is byte-frozen by
#     `verify_cross_build_policy.py`, and the live job is bound to it by the
#     equally frozen `needs`/`if` contract.
#   * `production-dockerfile-plan` keeps the narrower production-runtime
#     verdict from the base branch's `.github/scripts/ci_runtime_plan.py`. Its
#     `relevant` output still gates the two production-image jobs and their
#     fail-closed `production-dockerfile-smoke` aggregate, and it still
#     publishes the prior-scope `node_waypoint_relevant` verdict.
#     `verify_ci_runtime_cache.py` proves on every run that the
#     `node-waypoint-ebpf` classifier suite is a superset of every path that
#     verdict schedules, so retiring the `paths:` filter cannot narrow live
#     scheduling.
#
# Only the `changes` and `production-dockerfile-plan` planning jobs plus the
# `gate` aggregate run for an unrelated pull request.

on:
  workflow_dispatch:
    inputs:
      force_cold_cache:
        description: Skip BuildKit cache restore to prove cold-path image contracts
        type: boolean
        default: false
  pull_request:
  merge_group:
    types:
      - checks_requested
  # A queue entry is a combined commit and a main push is the merged result;
  # both re-evaluate this suite. Non-pull-request events force-run the
  # classifier, so `main` always carries a full live verdict.
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel a superseded PR/merge-group/main run on rapid re-push. Manual
# dispatches share one lane and run to completion.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('node-waypoint-ebpf-live-pr-{0}', github.event.pull_request.number) || (github.event_name == 'merge_group' && format('node-waypoint-ebpf-live-merge-group-{0}', github.event.merge_group.head_sha) || (github.event_name == 'push' && format('node-waypoint-ebpf-live-{0}', github.ref) || 'node-waypoint-ebpf-live-shared')) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  FERRUM_IMAGE_REPOSITORY: ferrum-edge
  FERRUM_IMAGE_TAG: node-waypoint-ebpf-live
  KIND_CLUSTER: ferrum-ebpf-live
  ISTIO_VERSION: 1.24.3
  # Commit behind the signed Istio 1.24.3 release tag.
  ISTIO_COMMIT_SHA: 44d0e58e49d0dc89e27fc4f8679c68132d46b887
  ISTIO_CRD_SHA256: 952afcf4b1bf47d2bdf1f230d636f9e613c3ee9cc68ef53ab751f6d59e2ee205
  FERRUM_CI_FORCE_COLD_CACHE: ${{ github.event.inputs.force_cold_cache == 'true' }}

jobs:
  changes:
    name: NodeWaypoint eBPF trigger
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout Ferrum Edge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      # Relevance decides whether a REQUIRED live gate runs at all, so it must
      # never be computed by code the pull request supplies: a PR that widens
      # its own suite patterns could declare itself irrelevant, skip the live
      # job, and still turn the required check green.
      #
      # Everything below reads ONE immutable trusted commit. The base-branch
      # tip is fetched from the base repository, pinned once to a full object
      # id, checked to hold the filter as a regular blob, and then read BY
      # OBJECT ID rather than by path. A fork head, a rewritten head, or a push
      # to the base branch mid-run therefore cannot swap the script between
      # validation and execution, and every failure exits non-zero so the gate
      # fails closed instead of quietly declaring itself irrelevant.
      #
      # This block is frozen by .github/scripts/verify_cross_build_policy.py
      # (see live_suite_relevance_errors); it is byte-identical across every
      # live-suite workflow apart from the suite, slug, and display name.
      - name: Check for node-waypoint-ebpf changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail

          filter_path=.github/scripts/live_suite_path_filter.py
          changed_files="$RUNNER_TEMP/node-waypoint-ebpf-changed-files.txt"
          trusted_filter="$RUNNER_TEMP/node-waypoint-ebpf-trusted-filter.py"
          rm -f -- "$changed_files" "$trusted_filter"
          : > "$changed_files"

          filter_args=(--suite node-waypoint-ebpf --changed-files "$changed_files")

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # `github.base_ref` names a branch in the BASE repository, so a fork
            # cannot control its contents -- but it is still untrusted text.
            # Reject anything outside a conservative branch charset before it
            # reaches a refspec so no option, pathspec, or revision-syntax
            # metacharacter can be smuggled into a git invocation.
            if ! printf '%s' "$BASE_REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,200}$'; then
              echo "::error::refusing to resolve an unsafe base ref" >&2
              exit 1
            fi
            case "$BASE_REF" in
              *..*|*//*|*/|*.lock|*/.*)
                echo "::error::refusing to resolve an unsafe base ref" >&2
                exit 1
                ;;
            esac
            fetched=false
            for attempt in 1 2 3; do
              if git fetch --no-tags --no-recurse-submodules origin \
                "+refs/heads/${BASE_REF}:refs/ferrum/trusted-base"; then
                fetched=true
                break
              fi
              echo "git fetch of ${BASE_REF} failed (attempt ${attempt}/3); retrying" >&2
              sleep $(( attempt * 10 ))
            done
            if [ "$fetched" != true ]; then
              echo "::error::git fetch of ${BASE_REF} failed after 3 attempts" >&2
              exit 1
            fi
            # Pin the moving tip exactly once; nothing below re-resolves a ref.
            trusted_sha="$(git rev-parse --verify --quiet refs/ferrum/trusted-base^{commit} || true)"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            # Merge queues synthesize a combined SHA. Use the event's base_sha
            # as the trusted filter source and the change-set base so a missing
            # pull_request payload cannot force-skip or check only main.
            if ! printf '%s' "$MERGE_BASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::merge_group base_sha missing or malformed" >&2
              exit 1
            fi
            if ! git cat-file -e "${MERGE_BASE_SHA}^{commit}" 2>/dev/null; then
              fetched=false
              for attempt in 1 2 3; do
                if git fetch --no-tags --no-recurse-submodules origin \
                  "${MERGE_BASE_SHA}"; then
                  fetched=true
                  break
                fi
                echo "git fetch of merge_group base failed (attempt ${attempt}/3); retrying" >&2
                sleep $(( attempt * 10 ))
              done
              if [ "$fetched" != true ]; then
                echo "::error::git fetch of merge_group base_sha failed after 3 attempts" >&2
                exit 1
              fi
            fi
            trusted_sha="$MERGE_BASE_SHA"
          else
            # A push to the default branch and a manual dispatch already run
            # trusted code, so the checked-out commit IS the trusted base.
            trusted_sha="$(git rev-parse --verify --quiet 'HEAD^{commit}' || true)"
            filter_args+=(--force-run)
          fi

          if ! printf '%s' "$trusted_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::trusted base did not resolve to a full commit id" >&2
            exit 1
          fi

          # Reject anything that is not a regular blob at that exact commit: a
          # symlink (mode 120000) would make a content read emit its target
          # path, a gitlink (160000) or tree (040000) carries no script at all,
          # and a missing entry must fail closed rather than fall back to the
          # pull request's own copy.
          entry="$(git ls-tree --full-tree "$trusted_sha" -- "$filter_path")"
          if [ "$(printf '%s\n' "$entry" | grep -c . || true)" != "1" ]; then
            echo "::error::${filter_path} is not a single tree entry at ${trusted_sha}" >&2
            exit 1
          fi
          entry_mode="$(printf '%s\n' "$entry" | awk '{print $1}')"
          entry_type="$(printf '%s\n' "$entry" | awk '{print $2}')"
          entry_object="$(printf '%s\n' "$entry" | awk '{print $3}')"
          entry_path="$(printf '%s\n' "$entry" | awk -F'\t' '{print $2}')"
          if [ "$entry_type" != "blob" ] || [ "$entry_path" != "$filter_path" ]; then
            echo "::error::${filter_path} is not a blob at ${trusted_sha}" >&2
            exit 1
          fi
          case "$entry_mode" in
            100644|100755) ;;
            *)
              echo "::error::${filter_path} has non-regular mode ${entry_mode}" >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$entry_object" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::${filter_path} did not resolve to an object id" >&2
            exit 1
          fi
          if [ "$(git cat-file -s "$entry_object")" -gt 262144 ]; then
            echo "::error::${filter_path} exceeds the 256 KiB trusted-filter ceiling" >&2
            exit 1
          fi
          git cat-file blob "$entry_object" > "$trusted_filter"

          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; then
            git diff --name-only --no-renames "${trusted_sha}...HEAD" \
              | sort > "$changed_files"
          fi

          # Isolated interpreter: no user site directory, no PYTHON* overrides,
          # and no implicit path entry, so nothing the pull request committed
          # can be imported by the trusted filter.
          python3 -I "$trusted_filter" --self-test
          plan="$(python3 -I "$trusted_filter" "${filter_args[@]}")"
          relevant="$(printf '%s\n' "$plan" | sed -n 's/^relevant=//p')"
          case "$relevant" in
            true|false) ;;
            *)
              echo "::error::trusted relevance filter produced no usable verdict" >&2
              exit 1
              ;;
          esac
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Relevance decided by trusted base ${trusted_sha}." >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$plan" | sed -n '/^## /,$p' >> "$GITHUB_STEP_SUMMARY"

  production-dockerfile-plan:
    name: Production Dockerfile smoke trigger
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      node_waypoint_relevant: ${{ steps.filter.outputs.node_waypoint_relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for production Dockerfile smoke changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail

          filter_path=.github/scripts/ci_runtime_plan.py
          changed_files="$RUNNER_TEMP/production-dockerfile-smoke-changed-files.txt"
          trusted_filter="$RUNNER_TEMP/production-dockerfile-smoke-trusted-filter.py"
          rm -f -- "$changed_files" "$trusted_filter"
          : > "$changed_files"

          filter_args=(--changed-files "$changed_files")

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! printf '%s' "$BASE_REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,200}$'; then
              echo "::error::refusing to resolve an unsafe base ref" >&2
              exit 1
            fi
            case "$BASE_REF" in
              *..*|*//*|*/|*.lock|*/.*)
                echo "::error::refusing to resolve an unsafe base ref" >&2
                exit 1
                ;;
            esac
            fetched=false
            for attempt in 1 2 3; do
              if git fetch --no-tags --no-recurse-submodules origin \
                "+refs/heads/${BASE_REF}:refs/ferrum/trusted-base"; then
                fetched=true
                break
              fi
              echo "git fetch of ${BASE_REF} failed (attempt ${attempt}/3); retrying" >&2
              sleep $(( attempt * 10 ))
            done
            if [ "$fetched" != true ]; then
              echo "::error::git fetch of ${BASE_REF} failed after 3 attempts" >&2
              exit 1
            fi
            trusted_sha="$(git rev-parse --verify --quiet refs/ferrum/trusted-base^{commit} || true)"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            if ! printf '%s' "$MERGE_BASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::merge_group base_sha missing or malformed" >&2
              exit 1
            fi
            if ! git cat-file -e "${MERGE_BASE_SHA}^{commit}" 2>/dev/null; then
              fetched=false
              for attempt in 1 2 3; do
                if git fetch --no-tags --no-recurse-submodules origin \
                  "${MERGE_BASE_SHA}"; then
                  fetched=true
                  break
                fi
                echo "git fetch of merge_group base failed (attempt ${attempt}/3); retrying" >&2
                sleep $(( attempt * 10 ))
              done
              if [ "$fetched" != true ]; then
                echo "::error::git fetch of merge_group base_sha failed after 3 attempts" >&2
                exit 1
              fi
            fi
            trusted_sha="$MERGE_BASE_SHA"
          else
            trusted_sha="$(git rev-parse --verify --quiet 'HEAD^{commit}' || true)"
            filter_args+=(--force-run)
          fi

          if ! printf '%s' "$trusted_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::trusted base did not resolve to a full commit id" >&2
            exit 1
          fi

          if ! git cat-file -e "${trusted_sha}:${filter_path}" 2>/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "node_waypoint_relevant=true" >> "$GITHUB_OUTPUT"
            echo "trusted base has not adopted ${filter_path}; running the full gate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          entry="$(git ls-tree --full-tree "$trusted_sha" -- "$filter_path")"
          if [ "$(printf '%s\n' "$entry" | grep -c . || true)" != "1" ]; then
            echo "::error::${filter_path} is not a single tree entry at ${trusted_sha}" >&2
            exit 1
          fi
          entry_mode="$(printf '%s\n' "$entry" | awk '{print $1}')"
          entry_type="$(printf '%s\n' "$entry" | awk '{print $2}')"
          entry_object="$(printf '%s\n' "$entry" | awk '{print $3}')"
          entry_path="$(printf '%s\n' "$entry" | awk -F'\t' '{print $2}')"
          if [ "$entry_type" != "blob" ] || [ "$entry_path" != "$filter_path" ]; then
            echo "::error::${filter_path} is not a blob at ${trusted_sha}" >&2
            exit 1
          fi
          case "$entry_mode" in
            100644|100755) ;;
            *)
              echo "::error::${filter_path} has non-regular mode ${entry_mode}" >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$entry_object" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::${filter_path} did not resolve to an object id" >&2
            exit 1
          fi
          if [ "$(git cat-file -s "$entry_object")" -gt 262144 ]; then
            echo "::error::${filter_path} exceeds the 256 KiB trusted-filter ceiling" >&2
            exit 1
          fi
          git cat-file blob "$entry_object" > "$trusted_filter"

          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; then
            git diff --name-only --no-renames -z "${trusted_sha}...HEAD" \
              > "$changed_files"
          fi

          python3 -I "$trusted_filter" --self-test

          emit_suite_verdict() {
            local suite="$1"
            local output_key="$2"
            local plan relevant
            plan="$(python3 -I "$trusted_filter" --suite "$suite" "${filter_args[@]}")"
            relevant="$(printf '%s\n' "$plan" | sed -n 's/^relevant=//p')"
            case "$relevant" in
              true|false) ;;
              *)
                echo "::error::trusted ${suite} relevance filter produced no usable verdict" >&2
                exit 1
                ;;
            esac
            echo "${output_key}=$relevant" >> "$GITHUB_OUTPUT"
            echo "Relevance (${suite}) decided by trusted base ${trusted_sha}." >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$plan" | sed -n '/^## /,$p' >> "$GITHUB_STEP_SUMMARY"
          }

          emit_suite_verdict production-dockerfile-smoke relevant
          # `relevant` gates the two production-image jobs below.
          # `node_waypoint_relevant` is the narrower prior-scope NodeWaypoint
          # verdict; since issue #3908 the live datapath follows the frozen
          # whole-suite `changes` classifier instead, and
          # verify_ci_runtime_cache.py proves that classifier is a superset of
          # every path this verdict schedules. It stays published so the
          # planner summary keeps reporting the narrower runtime scope.
          emit_suite_verdict node-waypoint-ebpf-live node_waypoint_relevant

  production-dockerfile-smoke-default:
    name: Production Dockerfile default image
    needs: production-dockerfile-plan
    if: needs.production-dockerfile-plan.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Ferrum Edge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Initialize runtime telemetry
        run: python3 .github/scripts/ci_runtime_telemetry.py init --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Time cache restore
        if: github.event.inputs.force_cold_cache != 'true'
        run: python3 .github/scripts/ci_runtime_telemetry.py start --phase cache-restore

      - name: Restore BuildKit local cache
        if: github.event.inputs.force_cold_cache != 'true'
        id: buildkit-cache
        uses: actions/cache/restore@374a27f26986edd8c430f386d152a856e179c0ae # v4.2.4
        with:
          path: ${{ runner.temp }}/production-dockerfile-smoke-default
          key: production-dockerfile-smoke-default-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            production-dockerfile-smoke-default-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Classify BuildKit cache restore
        if: github.event.inputs.force_cold_cache != 'true'
        id: cache-kind
        env:
          CACHE_HIT: ${{ steps.buildkit-cache.outputs.cache-hit }}
          CACHE_MATCHED: ${{ steps.buildkit-cache.outputs.cache-matched-key }}
          CACHE_PRIMARY: ${{ steps.buildkit-cache.outputs.cache-primary-key }}
          FORK_PR: ${{ github.event.pull_request.head.repo.fork }}
          CACHE_DIR: ${{ runner.temp }}/production-dockerfile-smoke-default
        run: |
          set -euo pipefail
          if [ "${FORK_PR:-}" = true ]; then
            policy=fork-restore-only
          else
            policy=trusted-publish
          fi
          python3 .github/scripts/ci_runtime_telemetry.py classify-restore \
            --name buildkit-local \
            --hit "${CACHE_HIT}" \
            --matched "${CACHE_MATCHED}" \
            --primary "${CACHE_PRIMARY}" \
            --path "$CACHE_DIR" \
            --note "scope=production-dockerfile-smoke-default policy=${policy}"

      - name: Finish cache restore timer
        if: always() && github.event.inputs.force_cold_cache != 'true'
        run: python3 .github/scripts/ci_runtime_telemetry.py end --phase cache-restore --status ${{ job.status == 'success' && '0' || '1' }}

      - name: Record cold-cache proof
        if: github.event.inputs.force_cold_cache == 'true'
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name buildkit-local \
            --hit false \
            --bytes 0 \
            --note "scope=production-dockerfile-smoke-default policy=force-cold skipped restore and save"

      - name: Time image build
        run: python3 .github/scripts/ci_runtime_telemetry.py start --phase image-build

      # Trusted exact github.sha hits restore cache-from and must not
      # export or save. Trusted partial matches and misses export mode=max
      # and save the new exact key. Fork PRs restore and must not export or
      # save. force_cold_cache skips restore, export, and save.
      - name: Build ordinary production runtime (trusted exact-hit restore-only)
        if: github.event.inputs.force_cold_cache != 'true' && github.event.pull_request.head.repo.fork != true && steps.cache-kind.outputs.kind == 'exact'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          load: true
          tags: ferrum-edge:production-default-smoke
          cache-from: type=local,src=${{ runner.temp }}/production-dockerfile-smoke-default
          provenance: false

      - name: Build ordinary production runtime
        if: github.event.inputs.force_cold_cache != 'true' && github.event.pull_request.head.repo.fork != true && steps.cache-kind.outputs.publish == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          load: true
          tags: ferrum-edge:production-default-smoke
          cache-from: ${{ steps.buildkit-cache.outputs.cache-matched-key != '' && format('type=local,src={0}/production-dockerfile-smoke-default', runner.temp) || '' }}
          cache-to: type=local,dest=${{ runner.temp }}/production-dockerfile-smoke-default-out,mode=max
          provenance: false

      - name: Build ordinary production runtime (fork restore-only)
        if: github.event.inputs.force_cold_cache != 'true' && github.event.pull_request.head.repo.fork == true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          load: true
          tags: ferrum-edge:production-default-smoke
          cache-from: ${{ steps.buildkit-cache.outputs.cache-matched-key != '' && format('type=local,src={0}/production-dockerfile-smoke-default', runner.temp) || '' }}
          provenance: false

      - name: Build ordinary production runtime (cold cache)
        if: github.event.inputs.force_cold_cache == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          load: true
          tags: ferrum-edge:production-default-smoke
          provenance: false

      - name: Finish image build timer
        if: always()
        run: python3 .github/scripts/ci_runtime_telemetry.py end --phase image-build --status ${{ job.status == 'success' && '0' || '1' }}

      - name: Time cache save
        if: github.event.inputs.force_cold_cache != 'true' && github.event.pull_request.head.repo.fork != true && steps.cache-kind.outputs.publish == 'true'
        run: python3 .github/scripts/ci_runtime_telemetry.py start --phase cache-save

      - name: Prepare BuildKit cache for save
        if: github.event.inputs.force_cold_cache != 'true' && github.event.pull_request.head.repo.fork != true && steps.cache-kind.outputs.publish == 'true'
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/production-dockerfile-smoke-default-out"
          dest="${RUNNER_TEMP}/production-dockerfile-smoke-default"
          if [ ! -d "$out" ]; then
            echo "::error::fresh BuildKit cache export is missing; refusing to save a stale restore" >&2
            exit 1
          fi
          rm -rf "$dest"
          mv "$out" "$dest"

      - name: Save BuildKit local cache
        if: github.event.inputs.force_cold_cache != 'true' && github.event.pull_request.head.repo.fork != true && steps.cache-kind.outputs.publish == 'true'
        uses: actions/cache/save@374a27f26986edd8c430f386d152a856e179c0ae # v4.2.4
        with:
          path: ${{ runner.temp }}/production-dockerfile-smoke-default
          key: production-dockerfile-smoke-default-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

      - name: Finish cache save timer
        if: always() && github.event.inputs.force_cold_cache != 'true' && github.event.pull_request.head.repo.fork != true && steps.cache-kind.outputs.publish == 'true'
        run: python3 .github/scripts/ci_runtime_telemetry.py end --phase cache-save --status ${{ job.status == 'success' && '0' || '1' }}

      - name: Verify ordinary distroless runtime contract
        run: |
          set -euo pipefail
          python3 .github/scripts/ci_runtime_telemetry.py start --phase ordinary-inventory
          ordinary_image=ferrum-edge:production-default-smoke
          docker run --rm --entrypoint /app/ferrum-edge "$ordinary_image" version

          inventory_image() {
            image="$1"
            output="$2"
            container="$(docker create "$image")"
            docker export "$container" | tar -tf - | sed -e 's#^\./##' -e 's#^/##' > "$output"
            docker rm "$container" >/dev/null
          }
          inventory_image "$ordinary_image" ordinary-runtime-files.txt

          grep -Fxq app/ferrum-edge ordinary-runtime-files.txt
          if grep -Fxq usr/sbin/ip ordinary-runtime-files.txt; then
            echo "ordinary runtime unexpectedly contains eBPF-only /usr/sbin/ip" >&2
            exit 1
          fi

          for forbidden in \
            bin/sh usr/bin/sh bin/bash usr/bin/bash bin/dash usr/bin/dash \
            bin/ash usr/bin/ash bin/zsh usr/bin/zsh bin/ksh usr/bin/ksh \
            bin/busybox usr/bin/busybox sbin/apk usr/sbin/apk usr/bin/apk \
            usr/bin/apt usr/bin/apt-cache usr/bin/apt-get \
            usr/bin/dpkg usr/bin/dpkg-query usr/bin/rpm usr/bin/yum \
            usr/bin/dnf usr/bin/microdnf usr/sbin/iptables \
            usr/sbin/ip6tables usr/sbin/nft; do
            if grep -Fxq "$forbidden" ordinary-runtime-files.txt; then
              echo "forbidden runtime tool is present: /$forbidden" >&2
              exit 1
            fi
          done
          python3 .github/scripts/ci_runtime_telemetry.py end --phase ordinary-inventory --status 0

      - name: Summarize ordinary image runtime
        if: always()
        run: python3 .github/scripts/ci_runtime_telemetry.py summarize --title "Production Dockerfile default image"

  production-dockerfile-smoke-ebpf:
    name: Production Dockerfile eBPF image
    needs: production-dockerfile-plan
    if: needs.production-dockerfile-plan.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Ferrum Edge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Initialize runtime telemetry
        run: python3 .github/scripts/ci_runtime_telemetry.py init --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Time cache restore
        if: github.event.inputs.force_cold_cache != 'true'
        run: python3 .github/scripts/ci_runtime_telemetry.py start --phase cache-restore

      - name: Restore BuildKit local cache
        if: github.event.inputs.force_cold_cache != 'true'
        id: buildkit-cache
        uses: actions/cache/restore@374a27f26986edd8c430f386d152a856e179c0ae # v4.2.4
        with:
          path: ${{ runner.temp }}/production-dockerfile-smoke-ebpf
          key: production-dockerfile-smoke-ebpf-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            production-dockerfile-smoke-ebpf-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Classify BuildKit cache restore
        if: github.event.inputs.force_cold_cache != 'true'
        id: cache-kind
        env:
          CACHE_HIT: ${{ steps.buildkit-cache.outputs.cache-hit }}
          CACHE_MATCHED: ${{ steps.buildkit-cache.outputs.cache-matched-key }}
          CACHE_PRIMARY: ${{ steps.buildkit-cache.outputs.cache-primary-key }}
          FORK_PR: ${{ github.event.pull_request.head.repo.fork }}
          CACHE_DIR: ${{ runner.temp }}/production-dockerfile-smoke-ebpf
        run: |
          set -euo pipefail
          if [ "${FORK_PR:-}" = true ]; then
            policy=fork-restore-only
          else
            policy=trusted-publish
          fi
          python3 .github/scripts/ci_runtime_telemetry.py classify-restore \
            --name buildkit-local \
            --hit "${CACHE_HIT}" \
            --matched "${CACHE_MATCHED}" \
            --primary "${CACHE_PRIMARY}" \
            --path "$CACHE_DIR" \
            --note "scope=production-dockerfile-smoke-ebpf policy=${policy}"

      - name: Finish cache restore timer
        if: always() && github.event.inputs.force_cold_cache != 'true'
        run: python3 .github/scripts/ci_runtime_telemetry.py end --phase cache-restore --status ${{ job.status == 'success' && '0' || '1' }}

      - name: Record cold-cache proof
        if: github.event.inputs.force_cold_cache == 'true'
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name buildkit-local \
            --hit false \
            --bytes 0 \
            --note "scope=production-dockerfile-smoke-ebpf policy=force-cold skipped restore and save"

      - name: Time image build
        run: python3 .github/scripts/ci_runtime_telemetry.py start --phase image-build

      # Trusted exact github.sha hits restore cache-from and must not
      # export or save. Trusted partial matches and misses export mode=max
      # and save the new exact key. Fork PRs restore and must not export or
      # save. force_cold_cache skips restore, export, and save.
      - name: Build eBPF production runtime (trusted exact-hit restore-only)
        if: github.event.inputs.force_cold_cache != 'true' && github.event.pull_request.head.repo.fork != true && steps.cache-kind.outputs.kind == 'exact'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: runtime-ebpf
          build-args: |
            FEATURES=cloud-secrets,ebpf
          load: true
          tags: ferrum-edge:production-ebpf-smoke
          cache-from: type=local,src=${{ runner.temp }}/production-dockerfile-smoke-ebpf
          provenance: false

      - name: Build eBPF production runtime
        if: github.event.inputs.force_cold_cache != 'true' && github.event.pull_request.head.repo.fork != true && steps.cache-kind.outputs.publish == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: runtime-ebpf
          build-args: |
            FEATURES=cloud-secrets,ebpf
          load: true
          tags: ferrum-edge:production-ebpf-smoke
          cache-from: ${{ steps.buildkit-cache.outputs.cache-matched-key != '' && format('type=local,src={0}/production-dockerfile-smoke-ebpf', runner.temp) || '' }}
          cache-to: type=local,dest=${{ runner.temp }}/production-dockerfile-smoke-ebpf-out,mode=max
          provenance: false

      - name: Build eBPF production runtime (fork restore-only)
        if: github.event.inputs.force_cold_cache != 'true' && github.event.pull_request.head.repo.fork == true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: runtime-ebpf
          build-args: |
            FEATURES=cloud-secrets,ebpf
          load: true
          tags: ferrum-edge:production-ebpf-smoke
          cache-from: ${{ steps.buildkit-cache.outputs.cache-matched-key != '' && format('type=local,src={0}/production-dockerfile-smoke-ebpf', runner.temp) || '' }}
          provenance: false

      - name: Build eBPF production runtime (cold cache)
        if: github.event.inputs.force_cold_cache == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: runtime-ebpf
          build-args: |
            FEATURES=cloud-secrets,ebpf
          load: true
          tags: ferrum-edge:production-ebpf-smoke
          provenance: false

      - name: Finish image build timer
        if: always()
        run: python3 .github/scripts/ci_runtime_telemetry.py end --phase image-build --status ${{ job.status == 'success' && '0' || '1' }}

      - name: Time cache save
        if: github.event.inputs.force_cold_cache != 'true' && github.event.pull_request.head.repo.fork != true && steps.cache-kind.outputs.publish == 'true'
        run: python3 .github/scripts/ci_runtime_telemetry.py start --phase cache-save

      - name: Prepare BuildKit cache for save
        if: github.event.inputs.force_cold_cache != 'true' && github.event.pull_request.head.repo.fork != true && steps.cache-kind.outputs.publish == 'true'
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/production-dockerfile-smoke-ebpf-out"
          dest="${RUNNER_TEMP}/production-dockerfile-smoke-ebpf"
          if [ ! -d "$out" ]; then
            echo "::error::fresh BuildKit cache export is missing; refusing to save a stale restore" >&2
            exit 1
          fi
          rm -rf "$dest"
          mv "$out" "$dest"

      - name: Save BuildKit local cache
        if: github.event.inputs.force_cold_cache != 'true' && github.event.pull_request.head.repo.fork != true && steps.cache-kind.outputs.publish == 'true'
        uses: actions/cache/save@374a27f26986edd8c430f386d152a856e179c0ae # v4.2.4
        with:
          path: ${{ runner.temp }}/production-dockerfile-smoke-ebpf
          key: production-dockerfile-smoke-ebpf-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

      - name: Finish cache save timer
        if: always() && github.event.inputs.force_cold_cache != 'true' && github.event.pull_request.head.repo.fork != true && steps.cache-kind.outputs.publish == 'true'
        run: python3 .github/scripts/ci_runtime_telemetry.py end --phase cache-save --status ${{ job.status == 'success' && '0' || '1' }}

      - name: Verify eBPF distroless runtime contract
        run: |
          set -euo pipefail
          python3 .github/scripts/ci_runtime_telemetry.py start --phase ebpf-inventory
          ebpf_image=ferrum-edge:production-ebpf-smoke
          docker run --rm --entrypoint /app/ferrum-edge "$ebpf_image" version
          docker run --rm --entrypoint /usr/sbin/ip "$ebpf_image" -V

          inventory_image() {
            image="$1"
            output="$2"
            container="$(docker create "$image")"
            docker export "$container" | tar -tf - | sed -e 's#^\./##' -e 's#^/##' > "$output"
            docker rm "$container" >/dev/null
          }
          inventory_image "$ebpf_image" ebpf-runtime-files.txt

          grep -Fxq app/ferrum-edge ebpf-runtime-files.txt
          grep -Fxq usr/sbin/ip ebpf-runtime-files.txt

          for forbidden in \
            bin/sh usr/bin/sh bin/bash usr/bin/bash bin/dash usr/bin/dash \
            bin/ash usr/bin/ash bin/zsh usr/bin/zsh bin/ksh usr/bin/ksh \
            bin/busybox usr/bin/busybox sbin/apk usr/sbin/apk usr/bin/apk \
            usr/bin/apt usr/bin/apt-cache usr/bin/apt-get \
            usr/bin/dpkg usr/bin/dpkg-query usr/bin/rpm usr/bin/yum \
            usr/bin/dnf usr/bin/microdnf usr/sbin/iptables \
            usr/sbin/ip6tables usr/sbin/nft; do
            if grep -Fxq "$forbidden" ebpf-runtime-files.txt; then
              echo "forbidden runtime tool is present: /$forbidden" >&2
              exit 1
            fi
          done
          python3 .github/scripts/ci_runtime_telemetry.py end --phase ebpf-inventory --status 0

      - name: Summarize eBPF image runtime
        if: always()
        run: python3 .github/scripts/ci_runtime_telemetry.py summarize --title "Production Dockerfile eBPF image"

  production-dockerfile-smoke:
    name: Production Dockerfile eBPF image smoke
    runs-on: ubuntu-latest
    needs:
      - production-dockerfile-plan
      - production-dockerfile-smoke-default
      - production-dockerfile-smoke-ebpf
    if: always()
    steps:
      - name: Fail when production-image planning fails
        if: needs.production-dockerfile-plan.result != 'success'
        run: exit 1

      - name: Fail when production-image planner output is unusable
        if: needs.production-dockerfile-plan.result == 'success' && needs.production-dockerfile-plan.outputs.relevant != 'true' && needs.production-dockerfile-plan.outputs.relevant != 'false'
        run: exit 1

      - name: Skip production-image smoke for unrelated changes
        if: needs.production-dockerfile-plan.outputs.relevant == 'false'
        run: |
          {
            echo "## Production Dockerfile eBPF image smoke"
            echo ""
            echo "No Dockerfile/runtime-sensitive paths changed. Image smoke skipped."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when the ordinary production image did not succeed
        if: needs.production-dockerfile-plan.outputs.relevant == 'true' && needs.production-dockerfile-smoke-default.result != 'success'
        run: exit 1

      - name: Fail when the eBPF production image did not succeed
        if: needs.production-dockerfile-plan.outputs.relevant == 'true' && needs.production-dockerfile-smoke-ebpf.result != 'success'
        run: exit 1

      - name: Report production-image smoke
        if: needs.production-dockerfile-plan.outputs.relevant == 'true'
        run: |
          {
            echo "## Production Dockerfile eBPF image smoke"
            echo ""
            echo "Ordinary \`runtime\` and distroless \`runtime-ebpf\` images built in parallel"
            echo "through BuildKit. Trusted exact \`${{ github.sha }}\` hits restore a scoped"
            echo "local BuildKit cache and do not export or save. Trusted partial matches"
            echo "and misses export \`mode=max\` and save the new exact key via pinned"
            echo "\`actions/cache/restore\` and \`actions/cache/save\`; fork pull"
            echo "requests restore that cache and do not save. Distroless inventories passed."
            echo ""
            echo "Warm PR target: <=30 minutes, p95 <=45 minutes, measured on hosted runs."
          } >> "$GITHUB_STEP_SUMMARY"

  node-waypoint-ebpf-live:
    name: NodeWaypoint eBPF live datapath
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Ferrum Edge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-node-waypoint-ebpf-live"

      - name: Build normal runtime binary
        run: cargo build --profile pr-build --bin ferrum-edge

      - name: Package normal image
        uses: ./.github/actions/package-ferrum-runtime-image
        with:
          binary-path: target/pr-build/ferrum-edge
          image: ${{ env.FERRUM_IMAGE_REPOSITORY }}:${{ env.FERRUM_IMAGE_TAG }}

      - name: Build eBPF runtime binary
        run: cargo build --profile pr-build --bin ferrum-edge --features cloud-secrets,ebpf

      - name: Install nightly Rust with rust-src
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          components: rust-src

      - name: Install bpf-linker
        uses: ./.github/actions/setup-bpf-linker

      - name: Build eBPF program
        run: cd ebpf && cargo +nightly build --target bpfel-unknown-none -Z build-std=core --release -p ferrum-ebpf

      - name: Package eBPF base image
        uses: ./.github/actions/package-ferrum-runtime-image
        with:
          binary-path: target/pr-build/ferrum-edge
          image: ${{ env.FERRUM_IMAGE_REPOSITORY }}:${{ env.FERRUM_IMAGE_TAG }}-ebpf-base
          bpf-elf-path: ebpf/target/bpfel-unknown-none/release/ferrum-ebpf

      - name: Add distroless iproute2 runtime closure
        env:
          BASE_IMAGE: ${{ env.FERRUM_IMAGE_REPOSITORY }}:${{ env.FERRUM_IMAGE_TAG }}-ebpf-base
          FINAL_IMAGE: ${{ env.FERRUM_IMAGE_REPOSITORY }}:${{ env.FERRUM_IMAGE_TAG }}-ebpf
        run: |
          docker build \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --file Dockerfile.iproute2-layer \
            --tag "$FINAL_IMAGE" \
            .

      - name: Package tools-capable NodeWaypoint UDP steering image
        env:
          BASE_IMAGE: ${{ env.FERRUM_IMAGE_REPOSITORY }}:${{ env.FERRUM_IMAGE_TAG }}-ebpf-base
          FINAL_IMAGE: ${{ env.FERRUM_IMAGE_REPOSITORY }}:${{ env.FERRUM_IMAGE_TAG }}-ebpf-tools
        run: |
          set -euo pipefail
          docker build \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --file Dockerfile.ebpf-tools-layer \
            --tag "$FINAL_IMAGE" \
            .
          docker run --rm --entrypoint /bin/sh "$FINAL_IMAGE" -c '
            set -eu
            for tool in ip iptables ip6tables iptables-save ip6tables-save; do
              command -v "$tool" >/dev/null 2>&1 || {
                echo "missing required steering tool: $tool" >&2
                exit 1
              }
            done
            test -s /app/ferrum-edge
            test -s /app/bpf/ferrum-ebpf
          '

      - name: Install Kubernetes tools
        uses: ./.github/actions/setup-kubernetes-tools

      - name: Create disposable dual-stack kind cluster
        run: |
          set -euo pipefail
          cat > kind-ebpf-live.yaml <<'YAML'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            ipFamily: dual
            podSubnet: "10.244.0.0/16,fd00:10:244::/56"
            serviceSubnet: "10.96.0.0/16,fd00:10:96::/112"
          nodes:
            - role: control-plane
            - role: worker
            - role: worker
          YAML
          kind create cluster --name "$KIND_CLUSTER" --config kind-ebpf-live.yaml --wait 180s
          kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{" podCIDRs="}{.spec.podCIDRs}{"\n"}{end}'
          for node in $(kind get nodes --name "$KIND_CLUSTER"); do
            docker exec "$node" sh -eu -c '
              mkdir -p /sys/fs/bpf
              grep -q " /sys/fs/bpf bpf " /proc/mounts || mount -t bpf bpf /sys/fs/bpf
              test -f /sys/fs/cgroup/cgroup.controllers
              mount | grep -q " /sys/fs/bpf type bpf "
            '
          done

      - name: Load images into kind
        run: |
          set -euo pipefail
          kind load docker-image "${FERRUM_IMAGE_REPOSITORY}:${FERRUM_IMAGE_TAG}" --name "$KIND_CLUSTER"
          kind load docker-image "${FERRUM_IMAGE_REPOSITORY}:${FERRUM_IMAGE_TAG}-ebpf" --name "$KIND_CLUSTER"
          kind load docker-image "${FERRUM_IMAGE_REPOSITORY}:${FERRUM_IMAGE_TAG}-ebpf-tools" --name "$KIND_CLUSTER"

      - name: Install Istio policy CRDs
        run: |
          set -euo pipefail
          crd_path="${RUNNER_TEMP}/istio-${ISTIO_VERSION}-crd-all.gen.yaml"
          crd_url="https://raw.githubusercontent.com/istio/istio/${ISTIO_COMMIT_SHA}/manifests/charts/base/files/crd-all.gen.yaml"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            --connect-timeout 30 --max-time 300 \
            -o "$crd_path" "$crd_url"
          test -s "$crd_path"
          printf '%s  %s\n' "$ISTIO_CRD_SHA256" "$crd_path" | sha256sum --check --strict
          kubectl apply --server-side=true -f "$crd_path"
          for crd in \
            authorizationpolicies.security.istio.io \
            peerauthentications.security.istio.io \
            requestauthentications.security.istio.io \
            destinationrules.networking.istio.io \
            envoyfilters.networking.istio.io \
            gateways.networking.istio.io \
            proxyconfigs.networking.istio.io \
            serviceentries.networking.istio.io \
            sidecars.networking.istio.io \
            virtualservices.networking.istio.io \
            workloadentries.networking.istio.io \
            workloadgroups.networking.istio.io \
            telemetries.telemetry.istio.io; do
            kubectl wait --for=condition=Established "crd/${crd}" --timeout=120s
          done

      - name: Run live NodeWaypoint eBPF datapath validation
        env:
          FERRUM_EBPF_LIVE_ACK_DISPOSABLE: "true"
          FERRUM_LIVE_KEEP_RESOURCES: "true"
          FERRUM_LIVE_REQUIRE_DUAL_STACK: "true"
          FERRUM_LIVE_TESTS_REQUIRED: "1"
          FERRUM_LIVE_IMAGE_REPOSITORY: ${{ env.FERRUM_IMAGE_REPOSITORY }}
          FERRUM_LIVE_IMAGE_TAG: ${{ env.FERRUM_IMAGE_TAG }}
          FERRUM_LIVE_DOCKER_NODE_EVIDENCE: "true"
          FERRUM_LIVE_SPIRE_PRODUCTION: "true"
          FERRUM_LIVE_TRUST_DOMAIN: "cluster.local"
        run: tests/k8s/node_waypoint_ebpf_live/run.sh

      - name: Assert a real BPF bypass metric
        run: |
          set -euo pipefail
          results="target/node-waypoint-ebpf-live/mesh-bpf-metrics"
          mkdir -p "$results"

          source_pod="$(kubectl -n ferrum-ebpf-live get pod -l app=src-a -o jsonpath='{.items[0].metadata.name}')"
          source_node="$(kubectl -n ferrum-ebpf-live get "pod/$source_pod" -o jsonpath='{.spec.nodeName}')"
          ambient_pod="$(
            kubectl -n ferrum get pod \
              -l app.kubernetes.io/name=ferrum-mesh-ambient \
              --field-selector "spec.nodeName=$source_node" \
              -o jsonpath='{.items[0].metadata.name}'
          )"
          if [[ -z "$source_pod" || -z "$source_node" || -z "$ambient_pod" ]]; then
            echo "could not resolve the source workload and same-node ambient proxy" >&2
            exit 1
          fi

          kubectl -n ferrum port-forward "pod/$ambient_pod" 19450:19010 \
            >"$results/port-forward.log" 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true; wait "$port_forward_pid" 2>/dev/null || true' EXIT

          fetched=false
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19450/metrics >"$results/before.prom"; then
              fetched=true
              break
            fi
            sleep 0.5
          done
          if [[ "$fetched" != "true" ]]; then
            echo "failed to fetch same-node ambient metrics before the bypass" >&2
            cat "$results/port-forward.log" >&2 || true
            exit 1
          fi

          metric='ferrum_mesh_bpf_drops_total{reason="exclude_port_hit"}'
          before="$(awk -v metric="$metric" '$1 == metric { value = $2 } END { print value }' "$results/before.prom")"
          if [[ ! "$before" =~ ^[0-9]+$ ]]; then
            echo "missing integer $metric baseline in ambient metrics" >&2
            grep 'ferrum_mesh_bpf_drops_total' "$results/before.prom" >&2 || true
            exit 1
          fi

          kubectl -n ferrum-ebpf-live exec "pod/$source_pod" -- \
            curl -fsS --connect-timeout 1 --max-time 1 \
            http://127.0.0.1:15020/ >/dev/null 2>&1 || true

          after="$before"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19450/metrics >"$results/after.prom"; then
              candidate="$(awk -v metric="$metric" '$1 == metric { value = $2 } END { print value }' "$results/after.prom")"
              if [[ "$candidate" =~ ^[0-9]+$ ]]; then
                after="$candidate"
                if ((after > before)); then
                  break
                fi
              fi
            fi
            sleep 0.5
          done

          if ((after <= before)); then
            echo "expected $metric to increase after a real excluded-port connection; before=$before after=$after" >&2
            grep 'ferrum_mesh_bpf_drops_total' "$results/after.prom" >&2 || true
            exit 1
          fi

          printf 'source_pod=%s\nsource_node=%s\nambient_pod=%s\nmetric=%s\nbefore=%s\nafter=%s\n' \
            "$source_pod" "$source_node" "$ambient_pod" "$metric" "$before" "$after" \
            >"$results/assertion.txt"

      - name: Collect diagnostics
        if: always()
        run: |
          set +e
          results="$GITHUB_WORKSPACE/node-waypoint-ebpf-live-results"
          mkdir -p "$results"
          kubectl get nodes -o wide > "$results/nodes.txt" 2>&1
          kubectl get pods -A -o wide > "$results/pods.txt" 2>&1
          kubectl get events -A --sort-by=.lastTimestamp > "$results/events.txt" 2>&1
          kubectl -n ferrum get all -o wide > "$results/ferrum-all.txt" 2>&1
          kubectl -n ferrum-ebpf-live get all -o wide > "$results/workloads-all.txt" 2>&1
          kubectl -n ferrum-ebpf-live describe pods > "$results/workloads-pods-describe.txt" 2>&1
          kubectl -n ferrum-ebpf-live describe svc > "$results/workloads-services-describe.txt" 2>&1
          kubectl -n spire-system get all -o wide > "$results/spire-all.txt" 2>&1
          kubectl -n spire-system logs statefulset/spire-server --all-containers --tail=500 > "$results/spire-server.log" 2>&1
          kubectl -n spire-system logs daemonset/spire-agent --all-containers --tail=500 > "$results/spire-agent.log" 2>&1
          helm -n ferrum get values ferrum-live --all > "$results/helm-values.yaml" 2>&1
          helm -n ferrum get manifest ferrum-live > "$results/helm-manifest.yaml" 2>&1
          kubectl -n ferrum describe deployment/ferrum-mesh-control-plane > "$results/control-plane-deployment-describe.txt" 2>&1
          kubectl -n ferrum describe daemonset/ferrum-mesh-node-agent > "$results/node-agent-daemonset-describe.txt" 2>&1
          kubectl -n ferrum describe daemonset/ferrum-mesh-ambient > "$results/ambient-daemonset-describe.txt" 2>&1
          kubectl -n ferrum describe pods > "$results/ferrum-pods-describe.txt" 2>&1
          kubectl -n ferrum logs deployment/ferrum-mesh-control-plane --all-containers --tail=500 > "$results/control-plane.log" 2>&1
          kubectl -n ferrum logs daemonset/ferrum-mesh-node-agent --all-containers --tail=500 > "$results/node-agent.log" 2>&1
          kubectl -n ferrum logs daemonset/ferrum-mesh-ambient --all-containers --tail=500 > "$results/ambient.log" 2>&1
          for pod in $(kubectl -n ferrum get pods -o name 2>/dev/null); do
            name="${pod#pod/}"
            kubectl -n ferrum logs "$pod" --all-containers --tail=500 > "$results/${name}.log" 2>&1
            kubectl -n ferrum logs "$pod" --previous --all-containers --tail=500 > "$results/${name}-previous.log" 2>&1
          done
          if command -v kind >/dev/null 2>&1 && command -v docker >/dev/null 2>&1; then
            for node in $(kind get nodes --name "$KIND_CLUSTER" 2>/dev/null); do
              docker exec "$node" sh -eu -c '
                dir="${1:-/run/ferrum/node-waypoint-pods}"
                if [ ! -d "$dir" ]; then
                  echo "$dir does not exist"
                  exit 0
                fi
                find "$dir" -maxdepth 2 -type f -print 2>/dev/null | sort | while IFS= read -r file; do
                  echo "--- $file"
                  sed -n "1,3p" "$file" 2>/dev/null || true
                done
              ' sh "${FERRUM_LIVE_NODE_WAYPOINT_REGISTRY_DIR:-/run/ferrum/node-waypoint-pods}" \
                > "$results/node-waypoint-registry-${node}.txt" 2>&1
            done
          fi
          if [ -d target/node-waypoint-ebpf-live ]; then
            cp -R target/node-waypoint-ebpf-live "$results/bpf-evidence"
          fi
          if [ -f target/node-waypoint-ebpf-live/live-assertions.json ]; then
            cp target/node-waypoint-ebpf-live/live-assertions.json "$results/live-assertions.json"
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: node-waypoint-ebpf-live-results
          path: node-waypoint-ebpf-live-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name "$KIND_CLUSTER" || true

  gate:
    name: NodeWaypoint eBPF Live
    needs:
      - changes
      - production-dockerfile-smoke
      - node-waypoint-ebpf-live
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize NodeWaypoint eBPF live result
        run: |
          {
            echo "## NodeWaypoint eBPF Live"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Failed before change detection completed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${{ needs.production-dockerfile-smoke.result }}" != "success" ]; then
            echo "Production Dockerfile image contract failed or did not complete: ${{ needs.production-dockerfile-smoke.result }}." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.relevant }}" = "false" ]; then
            echo "Skipped live datapath validation: no NodeWaypoint eBPF, node-agent, capture, chart, fixture, documentation, or CI workflow surfaces changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "${{ needs.changes.outputs.relevant }}" != "true" ]; then
            echo "Change detection returned an invalid relevance result: ${{ needs.changes.outputs.relevant }}." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${{ needs.node-waypoint-ebpf-live.result }}" != "success" ]; then
            echo "Live datapath validation failed or did not complete: ${{ needs.node-waypoint-ebpf-live.result }}." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Production Dockerfile image contract and live datapath validation passed." >> "$GITHUB_STEP_SUMMARY"
