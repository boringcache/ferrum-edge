name: Package Ferrum runtime image
description: >-
  Builds a small Ferrum runtime container image around an already-built
  ferrum-edge binary. Intended for CI labs that need a Kubernetes image but do
  not need to validate the full release Dockerfile build.

inputs:
  binary-path:
    description: Path to the prebuilt ferrum-edge binary.
    required: true
  image:
    description: Docker image name and tag to build.
    required: true
  base-image:
    description: >-
      Runtime base image. The supplied binary must be built against a glibc
      version no newer than this image provides.
    required: false
    default: gcr.io/distroless/cc-debian13:nonroot
  strip-binary:
    description: Strip debug symbols from the copied binary before packaging.
    required: false
    default: "true"
  bpf-elf-path:
    description: >-
      Optional compiled ferrum-ebpf ELF to copy into /app/bpf/ferrum-ebpf and
      expose through FERRUM_NODE_AGENT_BPF_ELF_PATH. Use for eBPF CI runtime
      images that package host-built artifacts instead of compiling in Docker.
    required: false
    default: ""
  install-iproute2:
    description: >-
      Copy the iproute2 `ip` executable and its resolved Debian 13 runtime
      library closure into the image. Required by the eBPF NodeWaypoint ingress
      redirect's exact policy-rule lifecycle; no shell or package manager is
      copied into the final image.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Build runtime image from prebuilt binary
      shell: bash
      env:
        BINARY_PATH: ${{ inputs.binary-path }}
        IMAGE: ${{ inputs.image }}
        BASE_IMAGE: ${{ inputs.base-image }}
        STRIP_BINARY: ${{ inputs.strip-binary }}
        BPF_ELF_PATH: ${{ inputs.bpf-elf-path }}
        INSTALL_IPROUTE2: ${{ inputs.install-iproute2 }}
      run: |
        set -euo pipefail

        binary_path="$BINARY_PATH"
        image="$IMAGE"
        base_image="$BASE_IMAGE"
        bpf_elf_path="$BPF_ELF_PATH"
        install_iproute2="$INSTALL_IPROUTE2"

        if [ "$install_iproute2" != "true" ] && [ "$install_iproute2" != "false" ]; then
          echo "::error title=Invalid install-iproute2 input::expected true or false"
          exit 1
        fi

        if [ ! -f "$binary_path" ]; then
          echo "::error title=Missing ferrum-edge binary::$binary_path does not exist"
          exit 1
        fi
        if [ -n "$bpf_elf_path" ] && [ ! -f "$bpf_elf_path" ]; then
          echo "::error title=Missing ferrum-ebpf ELF::$bpf_elf_path does not exist"
          exit 1
        fi

        image_context="$(mktemp -d)"
        trap 'rm -rf "$image_context"' EXIT

        install -m 0755 "$binary_path" "$image_context/ferrum-edge"
        if [ "$STRIP_BINARY" = "true" ] && command -v strip >/dev/null 2>&1; then
          strip "$image_context/ferrum-edge" || true
        fi
        if [ -n "$bpf_elf_path" ]; then
          mkdir -p "$image_context/bpf"
          install -m 0644 "$bpf_elf_path" "$image_context/bpf/ferrum-ebpf"
        fi

        {
          if [ "$install_iproute2" = "true" ]; then
            cat <<'DOCKERFILE'
        FROM debian:13-slim AS ferrum-iproute2
        RUN apt-get update && apt-get install -y --no-install-recommends iproute2 \
            && mkdir -p /iproute2-root \
            && cp --parents /usr/sbin/ip /iproute2-root \
            && ldd /usr/sbin/ip > /tmp/iproute2-ldd \
            && awk '$2 == "=>" && $3 ~ /^\// { print $3 } $1 ~ /^\// { print $1 }' \
                /tmp/iproute2-ldd > /tmp/iproute2-libraries \
            && test -s /tmp/iproute2-libraries \
            && while IFS= read -r library; do \
                cp -L --parents "$library" /iproute2-root || exit 1; \
            done < /tmp/iproute2-libraries \
            && rm -rf /var/lib/apt/lists/*
        DOCKERFILE
          fi
          printf 'FROM %s\n' "$base_image"
          if [ "$install_iproute2" = "true" ]; then
            cat <<'DOCKERFILE'
        COPY --from=ferrum-iproute2 /iproute2-root/ /
        DOCKERFILE
          fi
          cat <<'DOCKERFILE'
        # Keep this runtime stage aligned with the release Dockerfile runtime
        # stage. This action only swaps the source of /app/ferrum-edge so CI
        # conformance jobs can package a prebuilt binary instead of compiling
        # inside Docker.
        WORKDIR /app

        COPY --chown=65532:65532 ferrum-edge /app/ferrum-edge
        DOCKERFILE
          if [ -n "$bpf_elf_path" ]; then
            cat <<'DOCKERFILE'
        COPY --chown=65532:65532 bpf /app/bpf
        DOCKERFILE
          fi
          cat <<'DOCKERFILE'

        ENV PATH="/app:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            FERRUM_MODE=database \
            FERRUM_LOG_LEVEL=error \
            FERRUM_PROXY_HTTP_PORT=8000 \
            FERRUM_PROXY_HTTPS_PORT=8443 \
            FERRUM_ADMIN_HTTP_PORT=9000 \
            FERRUM_ADMIN_HTTPS_PORT=9443
        DOCKERFILE
          if [ -n "$bpf_elf_path" ]; then
            cat <<'DOCKERFILE'
        ENV FERRUM_NODE_AGENT_BPF_ELF_PATH=/app/bpf/ferrum-ebpf
        DOCKERFILE
          fi
          cat <<'DOCKERFILE'

        EXPOSE 8000 8443 9000 9443 50051

        HEALTHCHECK --interval=30s --timeout=10s --start-period=5s --retries=3 \
            CMD ["/app/ferrum-edge", "health"]

        LABEL org.opencontainers.image.title="Ferrum Edge" \
              org.opencontainers.image.description="High-performance edge proxy built in Rust" \
              org.opencontainers.image.source="https://github.com/ferrum-edge/ferrum-edge"

        USER 65532:65532

        ENTRYPOINT ["/app/ferrum-edge"]
        CMD ["run"]
        DOCKERFILE
        } > "$image_context/Dockerfile"

        docker build -t "$image" "$image_context"
